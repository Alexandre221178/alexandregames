{\"heading\":\"Support terms\",\"unofficial\":\"Warden is an independent fan project, not affiliated with the game's developers.\",\"privacy\":\"We do not sell or share players' data: it is used only inside Warden and becomes available to third parties only with the player's own consent.\",\"voluntary\":\"Support is voluntary. As a thank-you, supporters get extra sections of the site while the subscription is active; the set of sections may change.\",\"noGuarantee\":\"The game is updated often, so some features may stop working for a while — we fix them, but cannot promise uninterrupted operation.\",\"renewal\":\"The subscription renews automatically every month. Premium stays on until the end of the day the paid period ends. If a charge fails, Tribute retries it for up to 7 days — premium will come back by itself as soon as the payment goes through. You can cancel the subscription at any time in the Tribute bot — access stays until the end of the paid period.\",\"refund\":\"Premium did not turn on or something went wrong — write to us: we will sort it out and fix it. Money for a mistaken or double charge is refunded by Tribute through its subscriber support, @TributeSupportBot; we will help you with the request.\",\"contact\":\"Write to us\"}},\"telegram\":{\"heading\":\"Telegram\",\"description\":\"Link your Telegram: the Warden bot will be able to message you directly, and you will be able to sign in to the site with Telegram — from your phone as well. Linking is also required to get premium.\",\"notLinked\":\"Not linked\",\"linkButton\":\"Link Telegram\",\"openBot\":\"Open the bot in Telegram\",\"pendingHint\":\"Press “Start” in the bot — this page will update by itself. The link is single-use and valid for 15 minutes.\",\"cancel\":\"Cancel\",\"linked\":\"Linked\",\"linkedSince\":\"since {date}\",\"relink\":\"Link another one\",\"unlink\":\"Unlink\",\"unlinkedToast\":\"Telegram unlinked\",\"linkedToast\":\"Telegram linked\",\"impersonating\":\"Telegram linking is hidden in view-as mode.\"},\"notify\":{\"heading\":\"Telegram reminders\",\"description\":\"The bot messages you when a game timer is up, even if you are in the game on another screen. Timings come from the latest Warden data: if you sped something up or collected it from your phone, a reminder may arrive when it is already done.\",\"needsTelegram\":\"Link Telegram first — reminders come as private messages from the bot.\",\"needsPremium\":\"Personal reminders are part of premium. Support the project in the block above and the settings will unlock by themselves.\",\"savedToast\":\"Reminder settings saved\",\"sinceVersion\":\"from Warden {version}\",\"sinceVersionHint\":\"Works from Warden {version}, you have {current}. Update the extension and the reminder can be turned on.\",\"enableAll\":\"Enable all\",\"disableAll\":\"Disable all\",\"timer\":{\"BUILDING\":\"Construction finished\",\"RESEARCH\":\"Research finished\",\"TRAINING\":\"Troop training and upgrade\",\"HEALING\":\"Troop healing\",\"EXPEDITION\":\"9-hour Airship expedition is back\",\"HERO_CHEST\":\"Hero chest available again for an ad\",\"BANDIT_CAMPS\":\"New bandit camps have appeared\"},\"daily\":{\"label\":\"End-of-day summary\",\"off\":\"Don't send\",\"hours\":\"{hours} h before the daily reset\",\"reset\":\"The game day resets at {time} in your device time zone.\",\"resetUnknown\":\"The exact time will appear once Warden sees you log into the game.\",\"hint\":\"Unfinished Realm daily quests, whether the Tower is cleared and uncollected Airship expeditions, for each character Warden saw that day. If everything is done, there is no message.\"},\"groups\":{\"timers\":\"Timers\",\"daily\":\"Daily summary\"},\"timerHint\":{\"BUILDING\":\"When a Realm building finishes construction or an upgrade.\",\"RESEARCH\":\"When a technology finishes researching.\",\"TRAINING\":\"When new troops finish training or an upgrade.\",\"HEALING\":\"When wounded troops are healed in the infirmary.\",\"EXPEDITION\":\"Right away — only for the 9-hour expedition. Shorter expeditions go into the daily summary if their reward is still not collected by then.\",\"HERO_CHEST\":\"When the hero chest can be opened for an ad again.\",\"BANDIT_CAMPS\":\"Camps near the city respawn every 11 h — the bot tells you when they are back on the map.\"}},\"selfToken\":{\"heading\":\"Sign in on another device\",\"description\":\"For a phone or a browser without the extension: issue a token and paste it on the sign-in page under “I have a token”.\",\"ttlLabel\":\"Valid for\",\"create\":\"Issue token\",\"creating\":\"Creating...\",\"created\":\"Your token is ready\",\"createdHint\":\"Valid until {date}. It will not be shown again — copy it now.\",\"copy\":\"Copy\",\"createAnother\":\"Another one\",\"activeHeading\":\"Issued tokens\",\"expiresIn\":\"expires in {time}\",\"revoke\":\"Revoke\",\"revoking\":\"…\",\"revokeConfirm\":\"Revoke this token? The session on the other device will be terminated.\",\"revokedToast\":\"Token revoked\",\"copiedToast\":\"Copied to clipboard\",\"copyFailedToast\":\"Could not copy — select and copy it manually\",\"ttl\":{\"H1\":\"1 hour\",\"H6\":\"6 hours\",\"D1\":\"1 day\",\"W1\":\"1 week\"},\"status\":{\"ACTIVE\":\"Active\",\"EXPIRED\":\"Expired\",\"REVOKED\":\"Revoked\"},\"remaining\":{\"min\":\"{n} min\",\"hr\":\"{n} h\",\"day\":\"{n} d\"}}},\"noGuild\":\"No guild\",\"guildRole\":{\"MEMBER\":\"Member\",\"OFFICER\":\"Officer\",\"GENERAL\":\"General\",\"MASTER\":\"Master\"},\"login\":{\"guide\":{\"checking\":\"Checking for the Warden extension…\",\"pollInterval\":\"Checking sign-in every {seconds} sec\",\"altLogin\":\"Can't install the extension? Sign in with Telegram linked to your Warden account, or with an access token below. Game data won't be updated from this device, though.\",\"actions\":{\"installWarden\":\"Install Warden\",\"openGame\":\"Open the game\",\"yandex\":\"Download Yandex Browser\",\"chrome\":\"Download Google Chrome\"},\"install\":{\"title\":\"Warden extension not detected\",\"text\":\"Sign-in and game data updates go through the extension: it identifies you by the game. Install Warden from the Chrome Web Store and reload this page.\"},\"mobileInstall\":{\"title\":\"Install the Warden extension\",\"text\":\"This browser can install extensions from the Chrome Web Store — Warden will work just like on a computer.\",\"s1\":\"Open \u003cstore\u003eWarden in the Chrome Web Store\u003c/store\u003e and tap “Install”. If there is no button, turn on Desktop site and reload the store page. {how}\",\"s2\":\"Come back to this tab and reload the page — we'll show you how to start the game in the browser.\"},\"mobileBrowser\":{\"title\":\"Extensions don't work in this browser\",\"text\":\"On Android and HarmonyOS, the game with Warden works in a browser that installs extensions from the Chrome Web Store — for example, Yandex Browser. The game is opened there in Desktop site mode. Nothing is sent to Warden from the mobile game app.\",\"s1\":\"Install \u003cbrowser\u003eYandex Browser\u003c/browser\u003e.\",\"s2\":\"Open this page in it: hw-warden.com/login.\",\"s3\":\"Install the Warden extension and follow the hints on the page.\"},\"unknown\":{\"title\":\"Couldn't tell whether extensions work here\",\"text\":\"Try installing Warden from the Chrome Web Store. If there is no install button even with Desktop site enabled in the browser menu, extensions don't work here: on an Android phone or tablet, open this page in Yandex Browser; on a computer, use Google Chrome. Nothing is sent to Warden from the mobile game app — you need to play in a browser.\"},\"desktopBrowser\":{\"title\":\"A Chromium-based browser is required\",\"text\":\"Sign-in and game data updates go through the Warden extension. It installs in Chrome, Edge, Opera, Brave or Yandex Browser, and won't work in this browser.\"},\"ios\":{\"title\":\"Game data doesn't update on iPhone and iPad\",\"text\":\"The game doesn't start in a browser on iPhone and iPad — it shows a “play on PC” screen instead, so Warden can't get your data. You can still use the site: sign in with Telegram linked to your Warden account, or with an access token below. Your data will update when you play on a computer or Android device with Warden.\"},\"game\":{\"title\":\"Extension installed{version} — waiting for you to enter the game\",\"s1\":\"Open the game at \u003csite\u003ehero-wars-alliance.com\u003c/site\u003e.\",\"s2\":\"Wait for the guild to load — the extension will pick up your game id.\",\"s3\":\"You don't need to return to this tab — it will sign in on its own.\"},\"desktopMode\":{\"title\":\"Extension installed{version} — turn on Desktop site\",\"s1\":\"Turn on Desktop site: on phones and tablets the game won't start without it and shows a “play on PC” screen. {how}\",\"s2\":\"Open \u003csite\u003ethe game\u003c/site\u003e in this same browser and wait for the game and your guild to load — the extension will pick up your game id.\",\"s3\":\"Come back to this tab — it will sign in on its own.\",\"note\":\"Keep playing the same way: while the game is open in this browser with Desktop site on, Warden updates your data.\"}},\"checkingSession\":\"Checking session…\",\"sessionExpired\":\"Your session expired — sign in again to continue. Any unsaved actions need to be redone.\",\"tokenSummary\":\"I have an access token\",\"tokenHint\":\"If the extension cannot be installed, paste an access token here. Issue one for yourself in guild settings on a device that has the extension — or ask your guild master.\",\"tokenInvalid\":\"Token is invalid\",\"tokenExpired\":\"Token has expired or been revoked\",\"httpError\":\"Error {status}\",\"networkError\":\"Could not reach the server\",\"submitting\":\"Verifying…\",\"submit\":\"Sign in\",\"toMainHub\":\"Browse Warden public sections\",\"telegram\":{\"heading\":\"Sign in with Telegram\",\"hint\":\"For phones and browsers where the extension cannot be installed. Works if your Telegram is linked to a Warden account.\",\"button\":\"Sign in with Telegram\",\"starting\":\"Preparing the link…\",\"openBot\":\"Open the bot in Telegram\",\"pendingHint\":\"Press “Start” in the bot, confirm the sign-in with the button and come back here — the page will sign in by itself. The link is single-use and valid for 10 minutes.\",\"confirmHint\":\"The bot is waiting for confirmation: press “Confirm sign-in” there and come back here.\",\"cancel\":\"Cancel\",\"notLinked\":\"This Telegram is not linked to a Warden account\",\"notLinkedHint\":\"Sign in the usual way in this same browser — through the game with the extension or with your own access token. Telegram will be linked automatically, and from then on you can sign in with it from any device. The link request waits for an hour.\",\"retry\":\"Try again\",\"expired\":\"The link has expired or was already used — request a new one.\",\"startError\":\"Could not start the Telegram sign-in\",\"claimLinked\":\"Telegram linked — you can now use it to sign in to the site\",\"claimTaken\":\"The Telegram you tried to sign in with is already linked to another Warden account\",\"claimAccountLinked\":\"Another Telegram is already linked to this account — you can change it on the account page\"}},\"desktopModeHow\":{\"yandex\":\"How: tap ≡ (three lines) on the bottom bar and turn on “Desktop site”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\",\"chrome\":\"How: tap ⋮ (three dots) at the top right and check “Desktop site”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\",\"samsung\":\"How: tap ≡ (three lines) at the bottom right and choose “Desktop version”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\",\"firefox\":\"How: tap ⋮ (three dots) and turn on “Desktop site”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\",\"edge\":\"How: tap ··· (three dots) on the bottom bar and choose “View desktop site”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\",\"other\":\"How: open the browser menu (three dots or three lines) and turn on “Desktop site”. Warden takes data only from the game in a browser — nothing is sent from the mobile game app.\"},\"noSync\":{\"title\":\"Game data isn't updated from this device\",\"desktopModeTitle\":\"Turn on Desktop site to enter the game\",\"desktopMode\":\"Warden is installed, but the browser opens sites in mobile mode — the game won't start there and shows a “play on PC” screen. {how} Then open the game: your data will update while you play.\",\"hide\":\"Hide for a week\",\"install\":\"The Warden extension isn't installed here, so the site shows data sent from another device. To update it from here, install Warden in this browser and play in it.\",\"mobileInstall\":\"The Warden extension isn't installed here. Install it in this browser and open the game here in Desktop site mode — you also need it in the store if there is no install button. {how}\",\"mobileBrowser\":\"Extensions don't work in this browser. To update your data from a phone or tablet, install Yandex Browser, open hw-warden.com in it, install Warden and play there in Desktop site mode. Nothing is sent to Warden from the mobile game app.\",\"unknown\":\"The Warden extension wasn't found here. Try installing it from the Chrome Web Store. If installation isn't available, use Yandex Browser on an Android phone or tablet, or Google Chrome on a computer.\",\"desktopBrowser\":\"The Warden extension installs only in Chrome, Edge, Opera, Brave or Yandex Browser. To update your data from this computer, install Warden in one of them and play there.\",\"ios\":\"The game doesn't start in a browser on iPhone and iPad, so Warden doesn't work here. The site shows data sent by Warden from a computer or Android device: to update it, play the game there.\"}},\"privacy\":{\"metaTitle\":\"Privacy Policy\",\"metaDescription\":\"How Warden collects, uses and stores player data.\",\"title\":\"Warden Privacy Policy\",\"lastUpdated\":\"Last updated: 2026-11-03\",\"whatIs\":{\"heading\":\"What this is\",\"body\":\"Warden is a browser extension and web service for analytics and planning in the Hero Wars Alliance game. The extension reads the game's API responses and push messages in tabs on \u003ccode\u003ehero-wars-alliance.com\u003c/code\u003e and forwards the relevant ones to the Warden backend (\u003ccode\u003eapi.hw-warden.com\u003c/code\u003e). The extension does not send requests to the game on the player's behalf.\",\"disclaimer\":\"Warden is an independent project. It is not affiliated with the Hero Wars Alliance developers (Nexters).\"},\"collected\":{\"heading\":\"What data is collected\",\"item1\":\"\u003cb\u003ePlayer profile and progress\u003c/b\u003e — profile, guild and role, inventory and stocks, heroes and titans, Realm buildings, research, troops and infirmary, quests and events, Tower, Airship, chest timers, energy.\",\"item2\":\"\u003cb\u003eIn-game actions\u003c/b\u003e — starting, finishing, speeding up and cancelling construction, research, training and healing; collecting quest rewards. Needed for timers and notifications.\",\"item3\":\"\u003cb\u003eBattles and events\u003c/b\u003e — guild wars and championships, clashes, target marks and orders, fort wars and garrisons, arena and Realm battles, server ratings, attacks and scouting on the player's mines and city.\",\"item4\":\"\u003cb\u003eOther players' data visible in the game\u003c/b\u003e — names, guilds, servers, team rosters and power of guildmates and opponents, coordinates of guildmates' cities, guild announcements (texts the guild leadership publishes to the whole guild).\",\"item5\":\"\u003cb\u003eIdentifiers\u003c/b\u003e — the in-game player and account IDs (used to bind data to your Warden account) and the device identifier the game sends in a service request (\u003ccode\u003edeviceId\u003c/code\u003e).\",\"item6\":\"\u003cb\u003eWarden session token\u003c/b\u003e — stored in the \u003ccode\u003ehw_session\u003c/code\u003e cookie on the \u003ccode\u003e.hw-warden.com\u003c/code\u003e domain for signing in to the site (and on the legacy \u003ccode\u003e.pankov.dev\u003c/code\u003e domain during the migration).\",\"item7\":\"\u003cb\u003eLinked accounts and subscription\u003c/b\u003e — your Telegram ID if you linked Telegram; your Discord ID if your guild entered it; subscription details sent by Tribute (Telegram ID, amount, term).\",\"footer\":\"The extension \u003cb\u003edoes not intercept\u003c/b\u003e passwords, game access tokens, payment card data, private messages, regular guild chat or server chat, and does not forward any other game calls.\"},\"usage\":{\"heading\":\"What it is used for\",\"body\":\"For the site's sections (war and guild progress analytics, calculator, event planners, test battles, ratings, Realm) and for guild and personal notifications in Telegram and Discord.\"},\"storage\":{\"heading\":\"Where and how long it is stored\",\"item1\":\"Backend: PostgreSQL on a server under our control.\",\"item2\":\"Raw calls (the \u003ccode\u003ehar_rpc_call\u003c/code\u003e table) are deleted automatically 14 days after their last update.\",\"item3\":\"Derived data (war history, team rosters, ratings) is kept for as long as the service needs it or until deleted on request.\"},\"shared\":{\"heading\":\"Who can see it\",\"body\":\"We do not sell the data, use it for advertising or transfer it to third parties for their own purposes. The data may be seen by:\",\"item1\":\"\u003cb\u003eGuild members\u003c/b\u003e — analytics of their own guild, with permissions depending on their role.\",\"item2\":\"\u003cb\u003eAll site visitors\u003c/b\u003e — server ratings are public: name, portrait, guild, server, place and score of top players.\",\"item3\":\"\u003cb\u003eTelegram and Discord\u003c/b\u003e — they carry the text of notifications enabled by the guild or the player.\",\"item4\":\"\u003cb\u003eTribute\u003c/b\u003e — processes subscription payments; Warden does not receive payment card data.\"},\"deletion\":{\"heading\":\"How to delete your data\",\"body\":\"Message me on Telegram \u003ctg\u003e@HWWarden\u003c/tg\u003e with your in-game \u003ccode\u003eID\u003c/code\u003e — all related records will be removed within 7 days.\"},\"changes\":{\"heading\":\"Policy changes\",\"body\":\"Any material change updates this page and bumps the date at the top.\"},\"contacts\":{\"heading\":\"Contacts\",\"body\":\"Reach the author on Telegram \u003ctg\u003e@HWWarden\u003c/tg\u003e.\"}},\"errors\":{\"RESOURCE_NOT_FOUND\":\"Resource not found\",\"VALIDATION_ERROR\":\"Validation error\",\"BUSINESS_ERROR\":\"Action not allowed by business rules\",\"UNAUTHENTICATED\":\"Your session expired — sign in again\",\"INSUFFICIENT_ACCESS\":\"Insufficient permissions\",\"INTERNAL_ERROR\":\"Internal server error\",\"UNKNOWN\":\"An error occurred\",\"reason\":{\"no_attempts\":\"The player has no free attempts\",\"premium_required\":\"Personal reminders are available with premium\",\"target_killed\":\"The team is already defeated — nobody to assign\",\"day_finished\":\"The war day is over\",\"team_too_big\":\"A lineup holds at most five units\",\"telegram_error\":\"The guild chat did not accept the message\",\"in_game\":\"The player is marked on this position in the game — change it in the game\",\"no_previous_match\":\"No previous match against this guild — nothing to repeat\",\"not_guild_war\":\"Repeating a line-up is only available for Guild War\",\"plan_running\":\"The auto-plan is computing — assignments are locked for now; stop it in the “Attack plan” block\",\"plan_once\":\"This day's plan has already been computed — recomputation is unavailable, edit the assignments by hand\",\"plan_engines_off\":\"The plan engines are off — the computation cannot be started right now\",\"plan_no_attempts\":\"The guild has no free attempts left — t le\":\"Per-fighter totals\",\"fighter\":\"Fighter\",\"dealt\":\"Damage dealt\",\"received\":\"Damage taken\",\"heal\":\"Healing\",\"total\":\"Total\"}}}},\"counter\":{\"title\":\"Counter analysis\",\"subtitle\":\"Manual counter search for a team — same algorithm as the report, but with details.\",\"pickLabel\":\"Team (up to 5 heroes)\",\"run\":\"Analyze\",\"running\":\"Computing…\",\"noAccess\":\"This section is available to the owner and users with the “Arena analytics” role.\",\"analyzed\":\"Analyzing\",\"battles\":\"Battles counted\",\"beaten\":\"Losses\",\"sides\":\"Defence / Attack\",\"skippedIncomplete\":\"Skipped: incomplete\",\"skippedTimeout\":\"Skipped: timeouts\",\"skippedLowPower\":\"Skipped: below {power}K\",\"belowThreshold\":\"Fewer battles than the threshold ({min}) — the report shows no counter for such a team.\",\"pickNote\":\"Counters are sorted by a reliability score (as in the report): smoothed winrate × win-count confidence × win quality (beating a stronger team counts more). Only battles where both teams are above the power threshold are counted. The top one is the report's pick.\",\"scoreHint\":\"Reliability score: winrate × sample × win quality\",\"countersTitle\":\"Counter teams: {count}\",\"noCounters\":\"No team beat this pack in the collected battles.\",\"power\":\"Power\",\"quality\":\"Quality\",\"record\":\"Wins\",\"rolesShort\":\"breach {breach} · repel {repel}\",\"breakers\":\"Most often breached by\",\"openBattles\":\"Show battles\",\"testBattlesHint\":\"Test this matchup: counter pack attacks the analyzed team, all heroes maxed out (preset), arena rules\"},\"analytics\":{\"title\":\"Arena analytics\",\"subtitle\":\"Preliminary defence-team analytics, computed on the fly from the collected data (defences only, battles are not counted). To check a battle against a team from your arena search before you play it, use the Defence test tab.\",\"noAccess\":\"You don't have permission to view arena analytics.\",\"finishedSeasonHint\":\"Showing the frozen snapshot of the selected finished season.\",\"seasonLabel\":\"Season\",\"seasonUnknown\":\"not resolved — the season day is counted from the earliest date in the data\",\"seasonHint\":\"The season window and day come from the events calendar: only defences within the current season are analyzed (rating resets each season).\",\"pastSeasonHint\":\"Showing the frozen snapshot of the selected season; the recompute button restates it under the current scoring version.\",\"powerHint\":\"Teams below {power} power are excluded ({skipped} records skipped) — newbie rosters distort the statistics.\",\"battleLogHint\":\"Defences from battle logs ({count}) count only toward roster rating and power, not frequency: we do not attack everyone, so that sample is biased for popularity.\",\"minPowerLabel\":\"Power threshold\",\"minPowerApply\":\"Apply\",\"refreshHint\":\"Ratings are recomputed automatically every night at 05:00 and manually with the button.\",\"computedAt\":\"Updated\",\"refresh\":\"Recompute\",\"refreshing\":\"Recomputing…\",\"restate\":\"Restate history\",\"restating\":\"Recomputing all seasons…\",\"restateHint\":\"Recompute ALL seasons under the current scoring version (after a methodology change). Seasons without stored data are skipped.\",\"restateConfirm\":\"Recompute ALL seasons under the current scoring version? This overwrites their final snapshots (seasons without stored observations are skipped). Continue?\",\"restateDone\":\"Restated {count} seasons ({ids})\",\"restateNone\":\"No seasons with data to restate\",\"tabs\":{\"popular\":\"Popular defences\",\"best\":\"Best teams\",\"bestFighters\":\"Best fighters\",\"fighters\":\"Fighters\",\"combos\":\"Combos\"},\"combos\":{\"subtitle\":\"Pairs and trios of fighters most often placed together inside defence teams.\",\"methodology\":\"Computed over the same unique «player × team» pairs as fighters: every combination of 2 and of 3 out of the 5 heroes. Score: frequency 45% / rating 45% / power return 10% — power is deliberately near-irrelevant here: the damage dealer is pumped harder than the rest, so support combos would look super-efficient merely because they work without heavy investment. A combo's power is the summed own power of its heroes. Combos seen in fewer than 2 teams are excluded.\",\"sizeLabel\":\"Size\",\"sizeDuo\":\"Pairs\",\"sizeTrio\":\"Trios\",\"sortLabel\":\"Sort by\",\"sortUsage\":\"Usage\",\"sortScore\":\"Score\",\"packs\":\"Teams\",\"comboPower\":\"Combo power\",\"empty\":\"No combos yet — press «Recompute».\"},\"summary\":{\"period\":\"Period\",\"sightings\":\"Records\",\"players\":\"Players\",\"packs\":\"Rosters\"},\"noData\":\"No defence data within the current season window yet.\",\"filterEmpty\":\"Nothing matches the selected heroes.\",\"popular\":{\"subtitle\":\"Rosters by defence popularity (by distinct players; gear and skins are not part of roster identity).\"},\"best\":{\"subtitle\":\"All rosters by composite score — several criteria at once, not just frequency.\",\"methodology\":\"Score 0–100: frequency 25% (how many players run the roster, log scale — a rare roster is no match for a widespread one), league speed 30% (how fast and what share of players reach Champions II and III — the earlier in the season the better; Champions III weighs more), rating 20% (best achieved), power return 25% (how far the rating exceeds what is EXPECTED for that power: on average +100K power yields +267 rating, so reaching 12500 on 800K beats the same result on 1.1M; for rosters held by only 1–2 players it shrinks toward neutral). Components are normalized over the current sample.\"},\"pack\":{\"players\":\"Players\",\"sightings\":\"Records\",\"rating\":\"Rating avg/max\",\"power\":\"Avg power\",\"bestDay\":\"peak — day {day}\",\"bestDayHint\":\"Season day when the best rating was achieved\",\"counterToolHint\":\"Analyze this team’s counter\",\"testBattlesHint\":\"Move this team to the defence in Test battles: heroes maxed out (preset), arena rules\",\"climbDay\":\"day {day}\",\"climbNone\":\"not reached\",\"climbHint\":\"Share of the team's players who reached the league and the median season day. The day is observation-based, i.e. «no later than»\"},\"score\":{\"total\":\"Score\",\"rating\":\"Rating\",\"frequency\":\"Frequency\",\"climb\":\"League speed\",\"efficiency\":\"Power return\"},\"bestFighters\":{\"subtitle\":\"All fighters by composite score: usage frequency, rating of teams featuring the hero and return on the hero's own power.\",\"methodology\":\"Score 0–100: frequency 45% (how many players put the hero on defence, log scale), rating 45% (best rating of teams featuring the hero), power return 10% (how far the rating of teams featuring the hero exceeds what is expected for the hero's own power; the weight is deliberately small — the damage dealer is pumped harder than the rest, so supports would look super-efficient merely because they work without heavy investment). Components are normalized over the current sample.\",\"packs\":\"Teams\",\"ownPower\":\"Avg hero power\"},\"fighters\":{\"subtitle\":\"Heroes by defence usage (unique player × roster pairs) with a relic-level breakdown.\",\"unusedTitle\":\"Never seen on defence ({count})\",\"unusedHint\":\"The hero is absent from the rating: no player put them on defence this season\",\"relicLegend\":\"Relic\",\"packs\":\"{packs} teams\",\"buckets\":{\"relicNone\":\"none\",\"relic1to9\":\"1–9\",\"relic10to19\":\"10–19\",\"relic20to29\":\"20–29\",\"relic30\":\"30\"}}},\"common\":{\"vs\":\"VS\",\"reporter\":\"Reported by\",\"reporterFilterHint\":\"Reported by — show only their data\"},\"search\":{\"fieldNick\":\"Player nick\",\"fieldNickPlaceholder\":\"e.g. VeNoM\",\"fieldGuild\":\"Clan name\",\"fieldGuildPlaceholder\":\"name fragment\",\"fieldReporter\":\"Reported by\",\"fieldReporterPlaceholder\":\"log owner's nick\",\"reporterHint\":\"Only data reported by this player\",\"heroesInTeam\":\"Heroes in team\",\"anyRoster\":\"Any roster\",\"fieldMinPower\":\"Team power at least\",\"fieldMinPowerPlaceholder\":\"e.g. 1000000\",\"fieldSeason\":\"Season\",\"seasonAll\":\"All seasons\",\"dirAll\":\"All\",\"dirAttack\":\"Attacks\",\"dirDefence\":\"Defence\",\"dirHint\":\"Which team the filters apply to: nick, clan, roster and power\",\"kindAll\":\"All battles\",\"kindArena\":\"Arena\",\"kindGrand\":\"Grand\",\"kindHint\":\"Regular Arena or Grand Arena\",\"outcomeAll\":\"Any outcome\",\"outcomeAttackWon\":\"Attack won\",\"outcomeDefenceWon\":\"Defence won\",\"outcomeHint\":\"Battle outcome — independent of the selected side\",\"searching\":\"Searching…\",\"doSearch\":\"Search\",\"resetFilters\":\"Reset filters\",\"nothingFound\":\"Nothing found\",\"fieldOpponent\":\"Opponent\",\"fieldOpponentPlaceholder\":\"opponent nick\",\"myDirAttack\":\"My attacks\",\"myDirDefence\":\"My defences\",\"myDirHint\":\"Battles where you attacked or defended\",\"outcomeWon\":\"Wins\",\"outcomeLost\":\"Losses\",\"myOutcomeHint\":\"Battle outcome for you\"},\"battle\":{\"attackWon\":\"Attack broke through\",\"defenceHeld\":\"Defence held\",\"grandBadge\":\"Grand Arena\",\"grandBattleN\":\"Battle {n}\",\"grandScoreHint\":\"Attack score: attack wins — defence wins\",\"won\":\"Victory\",\"lost\":\"Defeat\",\"inAttack\":\"in attack\",\"inDefence\":\"in defence\",\"retest\":\"Re-run\",\"retestHint\":\"Move both teams of this battle to Test battles with exact fighter stats: run the battle again or swap a team\",\"retestError\":\"Could not move the battle\"},\"sighting\":{\"rating\":\"Rating\",\"day\":\"Day {day}\",\"dayHint\":\"Season day when this rating was recorded\",\"source\":\"Source\",\"sourceFind\":\"Search\",\"sourceEndBattle\":\"After battle\"},\"pagination\":{\"prev\":\"Prev\",\"next\":\"Next\",\"pageOf\":\"Page {page} of {pages}\",\"total\":\"{total} records\"},\"leagues\":{\"iron\":\"Iron\",\"bronze\":\"Bronze\",\"silver\":\"Silver\",\"gold\":\"Gold\",\"emerald\":\"Emerald\",\"platinum\":\"Platinum\",\"ruby\":\"Ruby\",\"diamond\":\"Champions\",\"legend\":\"Legends\"}},\"articles\":{\"seo\":{\"indexTitle\":\"Hero Wars Articles \u0026 Analysis\",\"indexDescription\":\"Analytical articles on Hero Wars Alliance: new hero breakdowns, synergies, counters and mechanics — powered by live Warden calculator data.\"},\"index\":{\"backToHome\":\"Home\",\"title\":\"Articles \u0026 analysis\",\"subtitle\":\"Hero and mechanics breakdowns powered by Warden calculator data\",\"empty\":\"No articles yet — the first one is on its way.\"},\"banner\":{\"badge\":\"New article\",\"allArticles\":\"All articles\"},\"admin\":{\"refresh\":\"Refresh data\",\"refreshing\":\"Rebuilding data…\",\"refreshError\":\"Failed to refresh data\"},\"items\":{\"crow\":{\"title\":\"Crow: skills, relic tier by tier, and armor penetration\",\"teaser\":\"The new Hero Wars hero declares a witch hunt on mages. We break down his skills and every relic tier, calculate how much armor penetration he needs against maxed mages, and find out who can provide it.\"},\"eva\":{\"title\":\"Eva: Marked, Max-Health Damage, and Tank Hunting\",\"teaser\":\"The new Hero Wars heroine shoots at both ends of the enemy pack at once. We break down her skills and every relic tier, calculate how much tank Health the Impossible Shot removes and how much armor penetration she is missing, and build teams around the Marked effect.\"},\"wodryn\":{\"title\":\"Wodryn, battle-tested: crit, defense and Law of the Forest\",\"teaser\":\"The new Nature tank, tested over thousands of test battles: what Oak Bark, the ally crit buff and the cleanse really do, which opponents Wodryn handles better than other tanks, and why his golden relic turns him into an answer to Kendle and Cleaver.\"}},\"crow\":{\"seo\":{\"title\":\"Crow — new Hero Wars hero breakdown: skills, relic tiers, armor penetration\",\"description\":\"Practical breakdown of Crow, the new Hero Wars hero: how his skills and every relic tier play, how much armor penetration he needs against mages and who can provide it, and which teams to build around him.\"},\"backToList\":\"All articles\",\"openCalculator\":\"Open in calculator\",\"skillsLoading\":\"Loading hero data from the calculator…\",\"intro\":{\"heading\":\"Who is Crow\",\"p1\":\"Crow is the 81st Hero Wars hero: a mid-line fighter with \u003cagility\u003eAgility\u003c/agility\u003e as his main stat and the \u003ccontrol\u003eControl\u003c/control\u003e class. His kit is built around \u003cs\u003eSilence\u003c/s\u003e and aimed at \u003cintelligence\u003eIntelligence\u003c/intelligence\u003e heroes, and all of his damage is \u003cphys\u003ephysical\u003c/phys\u003e.\",\"statsCaption\":\"Crow's key stats at max progression — live calculator data.\",\"p2\":\"Every skill card and number in this article is live data from our calculator, updating together with the game. The conclusions are theorycraft written before real battle statistics exist.\"},\"techParams\":{\"firstTimeout\":\"First timeout\",\"timeout\":\"Timeout\",\"animationDelay\":\"Animation delay\",\"area\":\"Area\",\"range\":\"Range\",\"seconds\":\"{value} sec\"},\"baseSkills\":{\"heading\":\"Base skills\",\"note\":\"The numbers in these cards use a realistic strong-account progression rather than the absolute maximum: level 120, glyphs at 40, only \u003cbrooch\u003e\u003c/brooch\u003e equipped from rank 16 gear, Technologies counted in full, Sets not counted.\",\"notes\":{\"THIRD\":\"Ally interaction: the extra hit triggers on any Silence — including ones applied by allies. Every Silence carrier on the team directly increases Crow's damage.\",\"FOURTH\":\"Ally interaction: the \\\"same active effect\\\" can be an ally's Silence. Keira, Thea, Rufus, Cascade or Mushy and Shroom prime the target — Crow detonates it for damage and an extended duration. The full list of Silence carriers is below.\"},\"summaryHeading\":\"How it plays as a whole\",\"summary1\":\"Fully leveled, the four skills form a self-accelerating loop: the first applies mass Silence to every Intelligence hero, the grenade pinpoints the most dangerous mage or healer, the third converts every Silence into extra basic-attack hits, and the fourth passive turns every reapplication into damage and a longer effect. The longer enemies stay Silenced, the faster Crow recharges and the harder he hits.\",\"summary2\":\"The key detail: the third and fourth skills don't care where the Silence came from. Any ally with the effect speeds up Crow's loop — a teammate who can apply Silence dramatically increases Crow's power.\"},\"silenceNote\":{\"title\":\"Reference: how Silence works\",\"intro\":\"Silence is a debuff that prevents a hero from using skills and abilities while it lasts. Breaking it down per the official \\\"Guardian's Guide\\\":\",\"blocksTitle\":\"What it blocks\",\"blocks1\":\"Abilities with any non-physical damage: magic damage, pure damage and healing. This includes basic attacks that deal magic damage (Xe'Sha, Morrigan, Satori) — Silence effectively disarms them.\",\"blocks2\":\"Skills whose power scales with magic attack — even ones that deal no damage: buffs, debuffs, shields (e.g. Cornelius' Protective Dome). Cornelius' basic attacks are blocked too: the damage is physical, but it scales with magic attack.\",\"blocks3\":\"Skills with no damage type and no stat scaling — mostly pure debuff applications (Fafnir's Smithing Mastery, Lars' Storm Lord, K'arkh's Horror Singularity).\",\"interruptTitle\":\"Interrupting\",\"interrupt\":\"A well-timed Silence doesn't just block abilities — it interrupts one being cast, including an ultimate after the energy is spent: the energy burns for nothing, and the cooldown timer means the skill can't be re-cast right after the effect ends. The classic example is an interrupted Death Ray from Xe'Sha.\",\"notTitle\":\"What Silence does NOT do\",\"not1\":\"It doesn't stop basic attacks with physical damage or skills that scale with physical attack.\",\"not2\":\"It doesn't remove effects already applied: shields, damage-over-time, buffs and debuffs keep working.\",\"not3\":\"It doesn't block passive abilities (Dorian's Initiation, Jet's Boundless Fury) or reactive skills that trigger on enemy actions.\",\"defenseTitle\":\"Protection against Silence\",\"defense\":\"Celeste's Purifying Sphere blocks an incoming Silence and removes an active one; Nebula's Serenity and Julius' Nine Lives Mechanism work similarly. These heroes will be especially annoying for Crow.\",\"source\":\"Source: the official \\\"Guardian's Guide\\\" (video)\"},\"silenceCarriers\":{\"heading\":\"Who else wields Silence\",\"intro\":\"The full list of heroes with Silence in their kits. Each of them is fuel for Crow's third and fourth skills. The skill cards use the same realistic progression as Crow's:\",\"items\":{\"keira\":{\"text\":\"The blades fly to the farthest enemy and Silence everyone they touch on the way back. Mass Silence across almost the whole enemy team plus the main physical AoE damage — Crow's most obvious partner.\"},\"thea\":{\"text\":\"Places magic marks above enemies' heads that apply Silence. The only healer with mass Silence: keeps the team alive while feeding Crow's passives.\"},\"rufus\":{\"text\":\"Periodic damage and Silence on the enemy with the highest Magic attack — a targeted double of Holy Grenade. Rufus is also a tank: he can hold the front line in a Crow lineup.\"},\"cascade\":{\"text\":\"The downpour applies effects based on the target's main stat: Intelligence heroes take physical damage and get Silenced. The same targeting logic as Crow's own. Bonus: Cascade's weapon artifact buffs the team's Armor Penetration (see the penetration section).\"},\"mushyAndShroom\":{\"text\":\"Fully healed sporelings run at enemies, explode and wrap them in a cloud of Mushroom Spores that Silences. A tank with AoE Silence — another front-line option.\"},\"soleil\":{\"text\":\"Reactive Silence: if an enemy tries to stun, blind or Silence the ally under the halo, the effect bounces back at them. Situational, but it still triggers Crow's passives.\"}}},\"relics\":{\"heading\":\"The relic: what each tier gives\",\"note\":\"Unlike the base skills, the relic numbers are computed at full max progression.\",\"tiers\":{\"RELIC_1\":{\"label\":\"Green relic — level 1\",\"text\":\"Witch Hunt is the main relic acquisition, and it comes immediately. An autonomous attack every few seconds on the most \\\"intelligent\\\" enemy — a strong boost to spreading Silence across the whole enemy team. And substantial extra damage: not just from the attack itself, but from everything each applied effect feeds afterwards — the third skill's extra hits and the fourth's detonations. Crow's loop becomes continuous even between casts.\"},\"RELIC_2\":{\"label\":\"Blue relic — level 10\",\"text\":\"The first skill now Silences every enemy, not just Intelligence heroes. Before this tier Crow is extremely weak against physical teams: his Silence barely finds anyone there and most of his kit idles. With the blue relic, physical teams have a hard time too — their support casts get blocked, and every Silenced fighter feeds Crow's third and fourth skills.\"},\"RELIC_3\":{\"label\":\"Violet relic — level 20\",\"text\":\"The grenade shards hit every Silenced enemy and extend their Silence. This tier should significantly boost both damage and Silence uptime: the targeted grenade becomes team-wide AoE, and the extension widens the window for extra hits and detonations. It brings no new tactics — the playstyle stays the same, just noticeably stronger.\"},\"RELIC_4\":{\"label\":\"Gold relic — level 30\",\"text\":\"Confinement: while at least one enemy is Silenced, opponents cannot apply Debuffs or Curses. A powerful effect that can radically flip a battle against heroes whose strength lies in debuffs: their key skills simply stop working while Crow lives and Silence is ticking.\"}},\"goldTargets\":\"Who Confinement switches off — every hero with the Debuff or Curse tag in their skills:\"},\"armorPen\":{\"heading\":\"Armor Penetration — the defining stat\",\"dealerIntro\":\"From everything above, one thing is obvious: Crow is not just a controller — he is a mass physical damage dealer. Extra hits on every Silenced target and detonations from reapplied Silence add up to a constant stream of physical attacks across the whole enemy team. Which means he depends on Armor Penetration even more than on his teammates' Silence.\",\"p1\":\"Physical damage in Hero Wars is reduced by the target's armor. As soon as Armor Penetration catches up with Armor, damage goes through at 100%. Mages have the lowest armor in the game — which is exactly why a well-built Crow starts dealing enormous damage to them.\",\"formula\":{\"reduction\":\"Damage reduction\",\"armor\":\"Armor\",\"pen\":\"Penetration\"},\"p2\":\"Crow brings part of the penetration himself: his book artifact, Laws Codex, levels Armor Penetration (and Health). The table below is computed from live calculator data for two scenarios at once: average progression vs average, and max vs max. Mages get an Armor talisman where available — the worst case for Crow.\",\"penAvg\":\"Crow's penetration at average progression: {value}\",\"penMax\":\"At max progression: {value}\",\"table\":{\"hero\":\"Mage\",\"armorAvg\":\"Armor (avg)\",\"passAvg\":\"Damage (avg)\",\"armorMax\":\"Armor (max)\",\"passMax\":\"Damage (max)\",\"need\":\"Missing\",\"full\":\"pierced\",\"loading\":\"Computing mage armor…\"},\"note\":\"\\\"Damage (avg/max)\\\" is the share of Crow's physical damage that gets through the mage's armor when both are at the corresponding progression. \\\"Missing\\\" is how much penetration ally buffs must add at max progression for damage to go through at 100%.\"},\"penDonors\":{\"heading\":\"Who can feed Crow Armor Penetration\",\"octavia\":{\"title\":\"Octavia — team-wide penetration from a skill\",\"text\":\"Moment of Focus increases Armor Penetration for all allies, and the effect is re-applied to anyone who dodges. We double-checked every skill in the game: Octavia is the only hero who hands Armor Penetration to the entire team directly through a skill.\"},\"fafnir\":{\"title\":\"Fafnir — stuns on full penetration\",\"text\":\"Knowledge of Flaws: allies' attacks that fully pierce armor stun the target. Crow attacks often (remember the third skill's extra hits), and once his penetration catches up with mage armor, every such hit also stuns. Control on top of control.\"},\"weapons\":{\"title\":\"Weapon artifacts with a penetration buff\",\"text\":\"These heroes' weapon artifacts buff the whole team's Armor Penetration when they cast their ultimate:\"},\"star\":{\"title\":\"Special mentions: Cascade and Tristan\",\"cascade\":\"Cascade picks himself: his weapon artifact feeds the team Armor Penetration, and his first skill Silences Intelligence heroes — a double synergy with Crow in a single hero.\",\"tristan\":\"The community considers Tristan the best Armor Penetration dealer — his ultimate fires very often, so the weapon buff is on the team almost permanently. The rumor about his new relic has been confirmed, and it turned out even stronger than expected: two Silence sources at once, plus a passive that converts excess penetration into extra damage. The relic skills (from the announcement; not in our game data yet):\",\"tristanRelics\":{\"seal\":{\"name\":\"Seal of Retribution\",\"text\":\"Every 11 seconds applies Silence for 4 sec to the enemy with the highest Magic Penetration (or the farthest enemy if there are none) and enemies around them. Everyone affected takes physical damage (80% Phys. atk.).\"},\"wrath\":{\"name\":\"Purifier's Wrath\",\"text\":\"The ultimate, Purifier's Wrath, is upgraded to Legendary: it now applies Silence to nearby enemies for 4 sec and deals increased damage (50% Phys. atk. + 18000).\"},\"payback\":{\"name\":\"Sinners' Payback\",\"text\":\"When Tristan or his allies penetrate a target's Armor, the enemy takes additional damage equal to 200% of the portion of damage that exceeded the Armor value.\"}},\"tristanOutro\":\"Sinners' Payback is a direct multiplier on the whole team's penetration: the harder Crow and his allies over-stack Armor Penetration above mage armor, the more bonus damage the target takes. And Tristan's two new Silences feed Crow's third and fourth skills. On paper — partner #1.\",\"tristanNamesNote\":\"Skill names are from the English announcement; official localization may differ.\"},\"isaacNote\":\"Careful with Isaac: his Homing Drones grant Armor Penetration only to Progress-way heroes. Crow follows the Path of Honor — he only gets the physical attack part.\"},\"critSynergy\":{\"heading\":\"Crit from Guus — a hidden damage multiplier\",\"p1\":\"There is one more teammate who opens Crow up from an unexpected angle — Guus. Crow has no crit of his own, which looks like a ceiling on his damage. But Guus hands crit to the whole team via Golden Feathers, and his fourth skill does two things at once for Honor-way heroes (and Crow follows the Path of Honor): it boosts their critical damage and adds bonus damage scaling with current health.\",\"p2\":\"The combo works like this: Guus grants Crow the crit he never had — and his entire stream of physical attacks (basic hits, the third skill's extra hits, Silence detonations) starts critting and hitting with a health-based bonus. For a hero whose whole strength is the volume of hits on Silenced targets, turning on crit is a powerful damage multiplier out of almost nothing. On top of that Guus heals and shores up Crow's survivability — exactly the \\\"time to spin up\\\" he lacked in the live battles.\"},\"artifact\":{\"heading\":\"The first artifact: a direct hint from the developers\",\"p1\":\"Crow's weapon artifact, Holy Grenade, buffs the whole team's Physical attack when he casts his ultimate. Mages get nothing from it — the developers are saying it outright: Crow belongs in a physical team.\",\"p2\":\"The full artifact set points the same way: the weapon — team physical attack, the Code of Law book — Armor Penetration and Health, the ring — Agility. It's all one theme: physical damage through armor.\"},\"liveBattles\":{\"heading\":\"Live battles: Crow's first field test\",\"p1\":\"I was lucky enough to get a live, decently built Crow — and a chance to test this article's hypotheses in real battles.\",\"capCrowHero\":\"Crow: 131,996 power, gear rank 16, max stars, talisman 50/50\",\"capCrowStats\":\"Hero sheet: physical attack 67,739, armor 30,510, magic defense 9,732, armor penetration 14,200\",\"p2\":\"The build is genuinely solid: rank 16, max stars, a 50/50 talisman and the blue relic. But two weak spots jump out of the hero sheet immediately: modest Magic Defense and — as discussed above — Armor Penetration that is simply not enough for a mage hunter.\",\"p3\":\"The weak link is clear: the glyphs are only at 40 out of 80, and that is exactly where the missing Magic Defense and Armor Penetration tiers live. At full progression Crow's effectiveness will grow substantially — keep that in mind when judging the results.\",\"capGlyphs\":\"Glyphs at 40 of 80 — the missing Magic Defense and Armor Penetration hide right here\",\"p4\":\"Unfortunately, I have no teammates who could help Crow spread Silence — and my battle-ready roster in general is not as wide as I would like.\",\"capRoster\":\"The battle roster: not many fully equipped heroes, and no Silence carriers among them\",\"p5\":\"My main team was quite strong not long ago. It is still alive, but with Electra von Grave everywhere and Iris buffed it has become largely ineffective — especially on defense.\",\"capMainTeam\":\"The account's main team — 942K power\",\"p6\":\"The goal of the test is simple: find out whether Crow can help specifically against mages. No miracles are expected on defense — at this progression any good physical team with Kayla or Yasmine is out of his reach. But on offense he absolutely must be tried.\",\"p7\":\"My main damage dealer is Yasmine, so my biggest problem today is Electra von Grave — especially under a strong Iris. That is where I started:\",\"capEnemyPack\":\"A typical defense of the current meta: Electra von Grave under Iris, 943K\",\"p8\":\"The result is sobering: teams like this did not fall before, and they do not fall now — no matter which combinations I tried Crow in.\",\"capAttempts\":\"Battle series in every possible combination — 0:10\",\"p9\":\"The battles make the problem obvious: Crow simply does not live long enough to cast his ultimate and shut everyone up — Iris burns the whole team down with Inner Fire too fast. Sometimes Silence even lands on Iris (though she often does not have the highest Intelligence on the team, so targeted skills fly past her), but by then it no longer saves the fight.\",\"capIrisSilenced\":\"Silence lands on Iris — the mask above her head…\",\"capTeamBurned\":\"…but Inner Fire is already raging, and the team burns down\",\"p10\":\"I came closest to victory using the classic Eternity team with Crow in place of Morrigan — with it, Crow had time to spin up and cover the entire enemy lineup with Silence.\",\"capEternity\":\"The classic Eternity team with Crow instead of Morrigan: still defeats, but the enemy is left barely alive\",\"capSilenceAll\":\"That spin-up in action: Silence masks above the entire enemy team\",\"p11\":\"Fights without Electra von Grave are a different story: Yasmine joins the party, and the results even against the same Iris improve dramatically.\",\"capWins\":\"Without Electra von Grave: 7:3 and 8:2 in series against Iris\",\"p12\":\"When Electra comes without Iris, things are also bearable: three wins out of ten is not much, but these teams simply did not fall at all before.\",\"capElectraNoIris\":\"Electra without Iris: 3:7 — not a triumph, but progress from zero\",\"p13\":\"Against Folio and Julius I luckily never had much trouble — and Crow certainly does not spoil the picture, even though Julius is considered his counter on paper.\",\"capFolioJulius\":\"Against Folio and Julius: 9:1\",\"outro1\":\"The main takeaway of day one: Crow is not a magic \\\"beat the meta\\\" button, but he is no disappointment either. Even at an \\\"average\\\" progression, with no Silence teammates and lagging penetration, he holds the usual matchups confidently and pulls out the ones where just a little was missing before. And the numbers from the penetration section show exactly where his true ceiling hides: skins and maxed glyphs — and Crow's physical damage will go through mages in full.\",\"outro2\":\"The recipe for unlocking him seems to be the same one we derived in theory: give Crow a couple of seconds to spin up and shield him from magic burst. With Tristan and his new relic in the new season — and possibly other Silence carriers — Crow's potential should open up completely.\"},\"disclaimer\":\"This article was written before any battle statistics existed for the hero: all conclusions are theoretical hypotheses derived from skill mechanics. The numbers in the skill cards and the armor table are live Warden calculator data and update together with the game.\"},\"eva\":{\"seo\":{\"title\":\"Eva — Hero Wars New Hero Breakdown: Marked Effect, Max-Health Damage, Armor Penetration\",\"description\":\"A practical breakdown of Eva, the new Hero Wars heroine: how the Marked effect and max-Health damage work, how much armor penetration she needs against tanks, what every relic tier adds, and which teammates unlock her.\"},\"backToList\":\"All articles\",\"openCalculator\":\"Open in calculator\",\"skillsLoading\":\"Loading hero data from the calculator…\",\"intro\":{\"heading\":\"Who Eva Is\",\"p1\":\"Eva is the 82nd hero of Hero Wars: a \u003cmarksman\u003eMarksman\u003c/marksman\u003e of the Progress way with \u003cagility\u003eAgility\u003c/agility\u003e as her main stat, always striving to take the farthest spot in the pack. All of her damage is \u003cphys\u003ephysical\u003c/phys\u003e, with a signature twist: it builds up not only from Physical attack but also from the target's maximum \u003chealth\u003eHealth\u003c/health\u003e.\",\"p2\":\"She plays against both ends of the enemy formation at once: her ultimate, Impossible Shot, hits the nearest enemy — usually the tank — while Focusing Scope applies \u003cs\u003eMarked\u003c/s\u003e to the farthest one, crushing it far harder than the renowned back-line hunter \u003cjhu\u003e\u003c/jhu\u003e ever did. Pressure on both lines simultaneously, with nothing clever required from the player.\",\"statsCaption\":\"Eva's key stats at maximum investment — live calculator data.\",\"p3\":\"All skill cards and numbers in this article are live data from our calculator and update together with the game. The conclusions are theoretical, made before any real battle statistics accumulated.\"},\"techParams\":{\"firstTimeout\":\"First timeout\",\"timeout\":\"Timeout\",\"animationDelay\":\"Animation delay\",\"seconds\":\"{value} sec\"},\"baseSkills\":{\"heading\":\"Base Skills\",\"note\":\"The numbers in the cards are calculated not at the absolute maximum but at a realistic strong-account investment: level 120, glyphs at 40, only the \u003cbrooch\u003e\u003c/brooch\u003e equipped from rank-16 gear, Technologies fully counted, Kits not counted.\",\"notes\":{\"FIRST\":\"The bonus damage scales with the target's maximum Health: 25% without the relic and 50% with the blue tier. If the nearest enemy is a tank, it is simple: the fatter it is, the harder the hit lands — the per-tank damage calculations are in the table below. In the current meta, though, there is an even tastier target — teams built around Byrna. Her Living Heart overfeeds the maximum Health of her allies, who are usually not tanks — their armor is noticeably lower. Byrna ends up personally turning the whole pack into easy targets for Eva: Health inflated, percentage damage enormous, and no armor to hold it back.\",\"SECOND\":\"The skill everything else is built around. While Marked is active on the far target, a separate hit delivers half of the damage that allied Marksmen deal to other heroes. The effect lasts 9 seconds on a 15-second cooldown — the mark is up for most of the fight. There is also a special trick in combination with the ultimate: half of Impossible Shot's damage — including the part calculated from the enemy tank's enormous Health — is transferred too. For a mage or healer in the back, whose Health pool is several times smaller than a tank's, that transferred slice of \\\"tank bulk\\\" can be fatal.\",\"FOURTH\":\"A passive multiplier for the whole class: the damage bonus for Eva and all allied Marksmen grows with the distance to the target — up to +400% of the original damage. A direct hint from the game: place Eva as far back as possible. More in the positioning section.\"},\"summaryHeading\":\"How It Plays as a Whole\",\"summary1\":\"The four skills assemble into a single machine: the ultimate carves a chunk off the tank proportional to the tank's own Health, Focusing Scope marks the back line, Piercing Shot sweeps everyone in front of Eva every 12 seconds, and Marksmen Unity multiplies the entire stream harder the farther Eva and her fellow Marksmen stand. One cast of the second skill — and every one of her shots starts working on two targets at once.\",\"summary2\":\"The key detail: the Marked transfer feeds on the damage of every Marksman on the team, and Eva's own damage counts too. She works perfectly well on her own — but every additional Marksman in the lineup literally multiplies her second target down to zero.\"},\"markedNote\":{\"title\":\"Reference: How Marked Works\",\"intro\":\"Marked is the Focusing Scope's tag on the farthest enemy. What matters about it:\",\"fact1\":\"Marked cannot be removed — it is not a regular debuff: cleanses and debuff immunities do nothing against it.\",\"fact2\":\"Summons cannot be targeted by the skill: against packs with summoned creatures, check who actually received the mark.\",\"fact3\":\"The transfer counts all damage dealt by allied Marksmen to other heroes — from auto-attacks to ultimates, including Eva's own damage.\",\"fact4\":\"The transferred portion arrives as a separate hit equal to half of the original damage.\",\"fact5\":\"The mark lasts 9 seconds on a 15-second cooldown, with the first cast landing at second 3 of the fight — the target spends most of the time Marked.\",\"source\":\"Source: official developer materials for content creators and in-game skill descriptions.\"},\"marksmen\":{\"heading\":\"Who Feeds the Mark\",\"intro\":\"The full list of Marksman heroes. Part of each one's damage is transferred into the Marked target, and every one of them is amplified by Marksmen Unity:\",\"p2\":\"Isaac stands apart — the developers outright call him a hero who pays for his slot twice: as a Marksman he feeds the Marked transfer with his own damage, while his drones hand Eva physical attack and armor penetration in return. More on him in the teammates section.\",\"p3\":\"Six Marksmen at once belong to the Progress way — Isaac, Daredevil, Ginger, Lara Croft, Astrid and Lucas, and Fox: Progress team buffs work on them alongside Eva. Fox and Cascade additionally bring artifact weapons with a team armor-penetration buff — more on that below. In all honesty: Fox — and arguably Daredevil — are hopelessly outdated, and Eva alone is unlikely to bring them back into the meta; Ginger, Lara Croft, and Astrid and Lucas, on the other hand, still show up in battles today. Either way, if you have any of those five invested — the pairing is absolutely worth trying: Marksmen have never had an amplifier this powerful.\"},\"hpDamage\":{\"heading\":\"Max-Health Damage — and the Price of Penetration\",\"intro\":\"The least obvious thing about Eva — and arguably the most interesting: her big hits scale with the target's maximum Health. Impossible Shot adds 25% of the target's max Health on top of its regular damage (50% with the blue relic), and the gold relic extends the same principle to every hit — an extra 10% of the target's maximum Health. The usual attack-versus-armor arms race is half-cancelled for her: the fatter the enemy, the harder it gets hit.\",\"p1\":\"There is a catch, though: all of this damage is physical, and the target's armor reduces it by the standard formula. Once Armor penetration catches up with Armor, damage goes through at 100%. The problem is that Impossible Shot's primary targets are tanks — the highest-armor heroes in the game. A mirror image of Crow: he hunted mages with paper armor, while Eva shoots at the best-protected part of the enemy pack.\",\"formula\":{\"reduction\":\"Damage reduction\",\"armor\":\"Armor\",\"pen\":\"Penetration\"},\"p2\":\"Eva brings part of the penetration herself: her Prime Access book levels exactly Armor penetration (plus Critical hit chance), and penetration is also built into her glyphs and talisman. A respectable kit for a new hero:\",\"penAvg\":\"Eva's penetration at average investment: {value}\",\"penMax\":\"Eva's penetration at maximum: {value}\",\"p3\":\"The table below runs on live calculator data: both Eva and the tanks at maximum investment, the tank's talisman set to Armor (the worst case for Eva), the shot with the blue relic (50% of Health). Sorted by Health: the fatter the tank, the more every missing point of penetration costs.\",\"table\":{\"hero\":\"Tank\",\"hp\":\"Health\",\"armor\":\"Armor\",\"shotReal\":\"Shot damage\",\"shotFull\":\"At full penetration\",\"need\":\"Missing\",\"full\":\"pierced\",\"loading\":\"Calculating tank health and armor…\"},\"note\":\"\\\"Shot damage\\\" — how much Impossible Shot (regular damage + 50% of the target's Health) deals through the tank's armor with Eva's own penetration. \\\"At full penetration\\\" — the same shot once penetration catches up with armor. \\\"Missing\\\" — how much penetration ally buffs need to contribute.\",\"p4\":\"The takeaway: with her own penetration Eva already pierces Julius and Aurora clean through, Rufus and Cleaver are just barely out of reach, while against the heavy armor of Ziri, Corvus, Astaroth, or Chabba most of the shot is lost without ally support. The developers say it directly: Tristan covers Eva's lack of Armor penetration. The full list of donors is below. And one heroine deserves a conversation of her own — we deliberately left her out of the table:\",\"electra\":{\"title\":\"A Special Case: Electra von Grave\",\"text\":\"Electra's Immortal Shell converts her armor, magic defense, and dodge into Health at the start of the battle: the pool inflates to the limit while her armor in combat is always zero — which is exactly why she is not in the table, her paper stats have nothing to do with a real fight. For Eva this means no penetration is needed at all, the damage goes through at 100%, and every percent of Impossible Shot counts off an enormous number — on paper Eva looks like one of the most direct counters to Electra. But let us stress: for now this is theory. Our first tests with the 25% Health cut (no blue relic) showed no breakthrough, and Pain's Embrace can absorb all incoming damage — returning half of it with the relic — so Eva's giant shot may end up working against her. There is no way to verify the full 50% cut, either: the blue relic will be handed out only to video bloggers, and leveling it up ourselves once it reaches general availability will take long enough that the question risks being irrelevant by then.\"},\"donors\":{\"octavia\":{\"title\":\"Octavia — Team-Wide Penetration from a Skill\",\"text\":\"Moment of Concentration increases Armor penetration for all allies, and the effect is additionally applied to anyone who dodges damage. Back in the Crow article we double-checked every skill in the game: Octavia is the only hero who grants armor penetration to the whole team directly through a skill.\"},\"fafnir\":{\"title\":\"Fafnir — Stuns on Full Penetration\",\"text\":\"Knowledge of Flaws: allies' attacks that fully pierce armor stun the target. Eva shoots often and over a wide area — the ultimate, Piercing Shot across the whole front line, auto-attacks — and once her penetration catches up with armor, every one of those hits also stuns. Health-based damage with control on top.\"}},\"weapons\":{\"title\":\"Artifact Weapons with a Penetration Buff\",\"text\":\"These heroes' artifact weapons buff the whole team's Armor penetration when their ultimate is used. The Marksmen on this list are especially interesting for Eva — Fox and Cascade feed both the Marked transfer and penetration:\"}},\"positioning\":{\"heading\":\"Position Is a Stat, Too\",\"p1\":\"Marksmen Unity turns formation into a direct damage source: the bonus grows with the distance to the target and tops out at +400% of the original damage — for Eva and all allied Marksmen. Eva already strives to take the farthest spot in the pack, but the rule is worth remembering in any manual setup: the farther she and her fellow Marksmen stand, the harder the entire Marksman side of the team hits.\",\"p2\":\"The game does not disclose the exact distance-to-bonus curve — the open data only shows the upper bound. So we turned the developers' tip — \\\"run the same fight while changing only the formation\\\" — into an experiment: same opponent, same first hit, only the position changes. We started with Dante. Without Eva on the team his hit deals 109, and position does not affect it at all: Marksmen Unity simply does not exist without Eva. Add Eva with Dante staying in the first slot — and the same hit now deals 134. That is +23% purely for her presence, and at minimal distance at that.\",\"capDanteBase\":\"Baseline: Dante in the first slot without Eva — a 109 hit\",\"capDanteEva\":\"Eva added: the same Dante from the same slot hits for 134 — +23%\",\"capDanteBack\":\"Dante one slot back, behind the tank: 170 — already +56% over the baseline\",\"p3\":\"Move Dante one slot back, behind the tank, and the hit grows to 170 — already +56% over the baseline. Then we repeated the test on Eva herself: from the first slot her shot deals 140, and from the last slot — 257, 84% more. There is a subtlety here, though: unlike with Dante, Eva's \\\"clean\\\" baseline cannot be measured — her passive is always on, and the 140 from the first slot is already a boosted hit. If her minimal-distance bonus matches Dante's (+23%), Eva's clean baseline is about 114 — and then the last-slot shot wins roughly +125% for her.\",\"capEvaFront\":\"Eva in the first slot: a 140 shot\",\"capEvaBack\":\"Eva in the last slot: 257 — 84% more than from the first slot\",\"table\":{\"test\":\"Test\",\"damage\":\"Damage\",\"gain\":\"Gain\",\"rows\":{\"r1\":{\"label\":\"Dante in slot 1, without Eva\",\"damage\":\"109\",\"gain\":\"— (baseline)\"},\"r2\":{\"label\":\"Dante in slot 1, with Eva\",\"damage\":\"134\",\"gain\":\"+23%\"},\"r3\":{\"label\":\"Dante one slot back, with Eva\",\"damage\":\"170\",\"gain\":\"+56%\"},\"r4\":{\"label\":\"Eva in slot 1\",\"damage\":\"140\",\"gain\":\"≈+23% (clean baseline ≈114)\"},\"r5\":{\"label\":\"Eva in the last slot\",\"damage\":\"257\",\"gain\":\"+84% vs slot 1, ≈+125% vs baseline\"}}},\"p4\":\"The takeaway: the advertised +400% is a ceiling for a hero knocked back to the far end of the battlefield — in a normal formation the number is practically unreachable. The working range of the bonus is roughly from +23% at close distance to ~+125% from the last slot. But even the minimal +23% is an excellent passive multiplier that Eva hands to every Marksman simply by being on the team.\",\"note\":\"Method: the first hit against the same opponent is compared. Caveats for the Eva measurement itself: the \\\"clean baseline ≈114\\\" is an estimate assuming her first-slot bonus equals Dante's (+23%); and to place Eva in the last slot the front positions had to be filled with allies — their buffs may have contributed part of the gain.\"},\"artifact\":{\"heading\":\"Artifacts: Crit Built into the Kit\",\"p1\":\"Eva's artifact weapon \u003cweapon\u003e\u003c/weapon\u003e buffs the whole team's Critical hit chance when her ultimate is used. The developers clearly consider it key: collaboration participants received Eva with Ruiner already at the absolute star.\",\"p2\":\"The set converges on a single point. The weapon — crit for the whole team; the Prime Access book — Armor penetration and Critical hit chance for Eva herself; the ring — Agility. Unlike Crow, who had to borrow crit from Guus, Eva's critical potential is wired straight into her artifacts and glyphs — a powerful multiplier on top of her dense stream of shots.\"},\"relics\":{\"heading\":\"Relic: What Each Tier Gives\",\"note\":\"Relic numbers, unlike the base skills, are calculated at full maximum investment.\",\"tiers\":{\"RELIC_1\":{\"label\":\"Green relic — level 1\",\"text\":\"Antivirus answers the biggest fear of a hero with long casts — crowd control. Every 8 seconds Eva removes all control effects from herself and blocks their reapplication for 5 seconds: for most of the fight, stuns and other control simply do not work on her. Impossible Shot takes 3 seconds of aiming — without this relic it is far too easy to interrupt.\"},\"RELIC_2\":{\"label\":\"Blue relic — level 10\",\"text\":\"Impossible Shot's bonus damage doubles: 50% of the target's maximum Health instead of 25%. The most straightforward and arguably the most valuable tier: against a tank with a million and a half Health, a single shot gains hundreds of thousands in value. The penetration table above already includes this tier.\"},\"RELIC_3\":{\"label\":\"Violet relic — level 20\",\"text\":\"Piercing Shot starts refunding Energy: 30 per enemy hit, up to 150 for sweeping a full pack. The skill recharges every 12 seconds, so the ultimate comes up noticeably more often — and with it, Ruiner's team-wide crit buff.\"},\"RELIC_4\":{\"label\":\"Gold relic — level 30\",\"text\":\"Explosive Payload extends Eva's signature principle to everything she does: every hit of hers is increased by 10% of the target's maximum Health (except damage over time and transferred damage). Auto-attacks, front-line sweeps, the ultimate itself — everything starts scaling with the enemies' bulk. The heavier the lineup across the field, the scarier a fully built Eva becomes.\"}}},\"partners\":{\"heading\":\"Who to Field with Eva\",\"intro\":\"The developers suggested the core themselves: Nebula, Julius, Isaac, Tristan, and Judge. Let's break down what exactly each of them gives Eva — the skill cards, as usual, are calculated at the owner's realistic investment:\",\"items\":{\"nebula\":{\"text\":\"Eva's best friend in Progress. The reworked Disharmony speeds up movement and skill recharge by 25% for Nebula and the allies behind her, and completely blocks incoming damage over time. Eva stands in the deepest slot — always inside the effect: faster recharge means more marks and sweeps, and the DoT block lets her, as the developers themselves put it, calmly live through her long casts. On top of that, Serenity heals and cleanses the nearest allies.\"},\"julius\":{\"text\":\"A Progress tank with shields for the whole team. Purrfect Reflexes passively speeds up the attacks and skills of everyone under a shield, and Progress heroes — Eva included — get an increased bonus. Julius's artifact weapon Cattelite Dish buffs the team's Critical hit chance — straight into the same bank as Eva's own Ruiner.\"},\"isaac\":{\"text\":\"The hero who pays for his slot twice. As a Marksman he feeds the Marked transfer with his own damage, while Eva's Marksmen Unity amplifies him in return. As a support he launches Observer Drones: physical attack for the allies behind him — and Progress heroes with drones additionally gain armor penetration. Eva, standing behind Isaac, collects every bonus at once.\"},\"judge\":{\"text\":\"The Progress controller from the developers' starter lineup. Force Field puts a shield that absorbs any damage on the leftmost and the rightmost ally — Eva in the farthest slot is almost guaranteed to be one of them, and the shield refreshes every 13 seconds. Judge's fourth skill also hands out stuns generously — the enemy team will have plenty to deal with instead of hunting Eva.\"},\"tristan\":{\"text\":\"The answer to Eva's main weakness. Tristan's artifact weapon, the Demonic Reliquary, buffs the whole team's Armor penetration, and his ultimate — by community experience — fires very often, keeping the buff up almost permanently. The gold relic Sinners' Payback adds a second floor: when the team's penetration exceeds the target's armor, the surplus converts into bonus damage — 200% of the excess. With Eva it is a double win: first penetration clears the path for her Health-based damage, then the overflow starts hitting on its own.\"}},\"teams\":{\"title\":\"Starter Lineups from the Developers\",\"core\":\"The core: Julius, Judge, Isaac, and Eva —\",\"flex\":\"— plus a fifth slot to taste and availability: Sebastian, Nebula, Cascade, or Polaris:\",\"antimage\":\"And the anti-mage version: Eva, Cascade, Julius, Rufus, and Tristan:\"},\"outro\":\"The overall recipe is transparent: Progress shields and haste keep Eva alive and fast, Marksmen feed the Marked transfer, penetration donors clear the path for her damage through armor. And do not be afraid to experiment: Eva can be confidently tried with any Marksmen — no one has ever amplified her classmates the way she does. Eva is self-sufficient, but every right neighbor multiplies her — a rare quality for a heroine who pressures both lines even on her own.\"},\"liveBattles\":{\"heading\":\"Live Battles: Eva Resurrects an Old Meta Team\",\"p1\":\"From theory to practice. An honest admission: I do not have many Progress-way heroes invested, so assembling the \\\"canonical\\\" lineup from the developers' recommendations is not an option. But the key teammate is available — \u003cnebula\u003eNebula\u003c/nebula\u003e, freshly reworked and, by the feel of it, specifically for Eva. Marksmen are even scarcer: only one is properly built — \u003cdante\u003eDante\u003c/dante\u003e at 198K power. So the team had to be found around this pair.\",\"p2\":\"And then I remembered a lineup that once thundered across the Arena: \u003coctavia\u003eOctavia\u003c/octavia\u003e, \u003ciris\u003eIris\u003c/iris\u003e, \u003cnebula\u003eNebula\u003c/nebula\u003e, \u003cdante\u003eDante\u003c/dante\u003e, \u003ccorvus\u003eCorvus\u003c/corvus\u003e. Back in the day I invested in it deliberately — and, classic story, by the time I finished it was hopelessly outdated. Swap Corvus for \u003ceva\u003eEva\u003c/eva\u003e — and suddenly this \\\"retired\\\" lineup starts producing phenomenal results. And that is with Eva and Nebula not even having relics yet.\",\"capTeam\":\"The test lineup: Octavia 176K, Eva 123K, Iris 212K, Nebula 151K, Dante 198K — 862K total power\",\"p3\":\"The skeleton of the team is the well-invested trio of \u003coctavia\u003eOctavia\u003c/octavia\u003e, \u003ciris\u003eIris\u003c/iris\u003e, and \u003cdante\u003eDante\u003c/dante\u003e. An important caveat: on their own they had long posed no threat whatsoever to meta lineups. The whole difference lies in the two new puzzle pieces.\",\"p4\":\"The first piece is \u003cnebula\u003eNebula\u003c/nebula\u003e. With her updated kit — above all the fully reworked Disharmony — she comes alive in this old team: the skill-recharge haste for \u003ciris\u003eIris\u003c/iris\u003e looks impressive, and Eva, shielded from damage over time, calmly carries her long casts to the end.\",\"p5\":\"The second piece is Eva herself. \u003cdante\u003eDante\u003c/dante\u003e was often left playing the tank in the first slot of this lineup anyway, so there was little choice about whom to sacrifice for Eva — \u003ccorvus\u003eCorvus\u003c/corvus\u003e steps out.\",\"p6\":\"As a result, several working synergies converge in a single five: the time-tested trio \u003coctavia\u003eOctavia\u003c/octavia\u003e + \u003ciris\u003eIris\u003c/iris\u003e + \u003cdante\u003eDante\u003c/dante\u003e, the new \u003ceva\u003eEva\u003c/eva\u003e + \u003cnebula\u003eNebula\u003c/nebula\u003e pair from the developers' recommendations, the fresh \u003ceva\u003eEva\u003c/eva\u003e + \u003cdante\u003eDante\u003c/dante\u003e combination — a Marksman feeding the \u003cs\u003eMarked\u003c/s\u003e transfer and receiving Marksmen Unity in return — and the excellent trio \u003cnebula\u003eNebula\u003c/nebula\u003e + \u003ciris\u003eIris\u003c/iris\u003e + \u003cdante\u003eDante\u003c/dante\u003e. Every link reinforces its neighbors, and the old team suddenly becomes very powerful.\",\"p7\":\"I have tried plenty of Arena opponents, but what impressed me most is how this — still far from maxed — team dismantles top lineups built around \u003csatori\u003eSatori\u003c/satori\u003e and \u003cbyrna\u003eByrna\u003c/byrna\u003e, even ones 150–200K power heavier than mine:\",\"capSatoriStats\":\"Battle breakdown against a 1,032K team (Satori, Lian, Byrna, Folio, Aidan): Dante deals 2.3M damage, Eva 1.3M, and Aidan goes down before restoring a single point of health\",\"capSatoriStart\":\"Opening of a fight against a top Satori + Byrna lineup\",\"capSatoriMid\":\"The middle of the same fight: half the opponents are already down\",\"p8\":\"The secret is that \u003caidan\u003eAidan\u003c/aidan\u003e and \u003csatori\u003eSatori\u003c/satori\u003e get switched off very quickly — and the fights end in victory nearly 100% of the time. The breakdown shows it well: Aidan sometimes dies without having healed a single ally.\",\"p9\":\"I will not even bother with lineups featuring \u003cdrayne\u003eDrayne\u003c/drayne\u003e and other non-tank heroes under \u003cbyrna\u003eByrna\u003c/byrna\u003e: they fall even more easily. Then again, they were never a serious threat to me in the first place.\",\"p10\":\"But the new combination is not almighty. All three meta tanks of today's Arena — \u003cjulius\u003eJulius\u003c/julius\u003e, \u003celectraVonGrave\u003eElectra von Grave\u003c/electraVonGrave\u003e, and \u003ccleaver\u003eCleaver\u003c/cleaver\u003e — remain a serious threat for the team at its current investment.\",\"p11\":\"Fights against \u003celectraVonGrave\u003eElectra von Grave\u003c/electraVonGrave\u003e are especially hard — contrary to the theoretical part, where we listed her among Eva's ideal victims:\",\"capElectraStart\":\"A fight against Electra von Grave under Iris and Byrna\",\"capElectraMid\":\"Electra survives the onslaught — the attack runs out of steam\",\"p12\":\"Yet the fights themselves are telling. Electra absorbs monstrous damage but stands on her last breath — she simply has enough time to live until her ultimate and turn the fight around. That is what gives hope: with the blue relic (50% of Health per shot instead of 25%) Eva should manage to remove Electra before the key cast — and therefore dismantle such lineups. Time will tell.\",\"capElectraWin\":\"One of the victories: Electra absorbed 6.19M damage — and finally went down\",\"p13\":\"Fights against enemy lineups with \u003ciris\u003eIris\u003c/iris\u003e deserve a separate mention. Very often everything comes down to an \u003ciris\u003eIris\u003c/iris\u003e-versus-\u003ciris\u003eIris\u003c/iris\u003e duel one on one — and then the attack loses on timeout. For defense this is a golden property: Iris is a meta mage, people attack with her constantly, and this quirk either deters potential attacks outright or steadily racks up defense points.\",\"capIrisDuel\":\"A classic of the genre: only two Irises left on the field — the attack runs into the timeout\",\"outro\":\"The takeaway of the first days: Eva did not just fit into a lineup — she brought back to life a team that had been gathering dust for years. For me, that is her true superpower: not demanding a brand-new team built from scratch, but multiplying what was already there.\"},\"collabNote\":\"Disclosure: this material was prepared as part of a paid collaboration with the Hero Wars developers — Eva with the full artifact set was provided by them for testing. At the time of publication Eva is available in the game's web shop.\",\"disclaimer\":\"The conclusions of the analytical part are theoretical hypotheses derived from skill mechanics; the Live Battles section reflects the first days of Arena testing and will be expanded. The numbers in the skill cards and the tank table are live Warden calculator data and update together with the game.\"},\"wodryn\":{\"seo\":{\"title\":\"Wodryn — Hero Wars new hero breakdown, battle-tested\",\"description\":\"Wodryn, the new Hero Wars tank, tested over thousands of test battles: Unbowed Oak, the ally crit buff, the cleanse, a comparison with 11 tanks, the relic tier by tier, the Tristan pairing and Law of the Forest against Kendle and Cleaver.\"},\"backToList\":\"All articles\",\"openCalculator\":\"Open in calculator\",\"skillsLoading\":\"Loading hero data from the calculator…\",\"techParams\":{\"firstTimeout\":\"First timeout\",\"timeout\":\"Timeout\",\"seconds\":\"{value} s\"},\"variants\":{\"own\":\"My build\",\"avg\":\"Average\",\"max\":\"Maximum\"},\"teams\":{\"phys\":\"Physical\",\"nature\":\"Nature\",\"magic\":\"Magic\"},\"intro\":{\"heading\":\"Who is Wodryn\",\"p1\":\"Wodryn is the 83rd hero of Hero Wars: a Nature \u003ctank\u003eTank\u003c/tank\u003e whose main attribute is \u003cstrength\u003eStrength\u003c/strength\u003e. All of his damage is \u003cphys\u003ephysical\u003c/phys\u003e, and his kit revolves around \u003cs\u003eOak Bark\u003c/s\u003e: he strips debuffs and control from the team, gains Oak Bark, gets energy from it for every hit he takes, and hands out \u003ccrit\u003eCrit hit chance\u003c/crit\u003e, which works for him both as damage and as defense.\",\"p2\":\"Almost all of his skills affect the allies behind him, and Wodryn stands second from the front line — only \u003cchabba\u003e\u003c/chabba\u003e can b
