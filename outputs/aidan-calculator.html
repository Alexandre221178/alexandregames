e in front of him. In practice, \\\"behind him\\\" means the whole team.\",\"statsCaption\":\"Wodryn's key stats at maximum upgrade — live calculator data.\"},\"method\":{\"title\":\"Where the numbers come from\",\"p1\":\"Everything below I checked in test battles under Arena rules on auto — against the defenses most common in the Arena right now. That adds up to {battles} battles, so the numbers in this article are counted, not eyeballed.\",\"p2\":\"As statistics I publish only battles with my own account's build: Wodryn at level 120, 6 stars, no relic, Talisman of Two Forms maxed (power 130,080), the other heroes as they are on my account. That way any player with a similar build can reproduce the result.\",\"p3\":\"How Wodryn does at the average and max builds I estimated separately — those numbers are marked as an estimate. Treat differences below 10 pp as \\\"about even\\\".\"},\"baseSkills\":{\"heading\":\"Base skills\",\"note\":\"The cards are computed at a realistic strong-account build — close to the one I tested Wodryn with in battle: hero level 120, glyphs at 40, of the rank-16 items only the \u003cbrooch\u003e\u003c/brooch\u003e is equipped, Technologies fully counted, Sets not counted. I also estimated how he does at a stronger build — those numbers are marked as an estimate further on.\",\"notes\":{\"FIRST\":\"Wodryn's key skill in battle — and not because of the numbers on the card. After the first Crown he casts it again roughly every three seconds until the end of the fight: Oak Bark gives him energy for every hit he takes. The Crown hits all enemies under it, always hits and cannot be dodged, and every cast triggers his artifact weapon.\",\"SECOND\":\"Every 9 seconds on paper, once or twice per battle in practice: once his ultimate starts coming every three seconds, there is simply no window left for other skills. The first cast lands around the seventh second, when the enemy has already applied their debuffs, and it is what starts the cycle: while Oak Bark is active, every hit on Wodryn gives him +100 energy.\",\"THIRD\":\"A 9-second crit buff for the allies behind him. Like Bark Renewal, in battle it fires about once — around the ninth second, right before the first ultimate. That is also why the passive growth of his own crit per Oak Bark layer removed barely happens more than once — more in the crit section.\",\"FOURTH\":\"Wodryn's strongest skill. A reduced hit is cut by exactly 67%, and the chance depends on the crit of whoever is being hit. More than half of the hits on Wodryn himself are reduced, and only slightly fewer on the crit heroes next to him: about half on \u003cleonel\u003e\u003c/leonel\u003e and \u003coya\u003e\u003c/oya\u003e, 44% on \u003cyasmine\u003e\u003c/yasmine\u003e, 32–37% on \u003cguus\u003e\u003c/guus\u003e. Details are in \\\"Crit as defense\\\".\"}},\"cycle\":{\"heading\":\"How it plays in battle\",\"p1\":\"The battle records show the same pattern in almost every fight. At second seven Wodryn cleanses the team and gains Oak Bark, at second nine he hands out crit with Deepwood Might, at second ten he fires the first Crown of Wrath — and from then on he only ults.\",\"sec\":\"s\",\"legend\":{\"bark\":\"Bark Renewal\",\"thicket\":\"Deepwood Might\",\"ult\":\"Crown of Wrath\"},\"caption\":\"A typical Wodryn battle; the scale is battle seconds.\",\"p2\":\"This is the main takeaway about the hero: Wodryn is less a crit buffer than a tank that keeps casting his ultimate. While Oak Bark is active, every hit on him gives +100 energy, and the harder he is hit, the more often the Crown falls. Bark Renewal and Deepwood Might fire once or twice per battle.\",\"p3\":\"Crown of Wrath sometimes stuns enemies, although the description does not say so. This is not a hidden property of the ult but a general game rule: a single hit that takes more than a fifth of the target's health stuns it for less than a second. Heavy hits from \u003ctristan\u003e\u003c/tristan\u003e and \u003ccrow\u003e\u003c/crow\u003e stun the same way. A critting Crown hits twice as hard and crosses that threshold more often, which is why three quarters of its stuns ({stunOnCrit}) land on crits.\"},\"oak\":{\"heading\":\"Crit as defense: Unbowed Oak\",\"p1\":\"The higher a hero's crit chance, the more often Unbowed Oak triggers on them, and every reduced hit is cut to a third. The table lists every hero of three teams: next to the share of reduced hits you can see how often the hero crits in battle.\",\"table\":{\"team\":\"Team\",\"hero\":\"Hero\",\"share\":\"Reduced\",\"saved\":\"HP saved per battle\",\"thousand\":\"k\",\"crit\":\"Hero's crit\"},\"caption\":\"My build, 150 battles per team. \\\"Hero's crit\\\" is the crit share of their physical hits in these battles; a dash means there were hardly any physical crits.\",\"p2\":\"In total Unbowed Oak saves the team {savedMin}–{savedMax} million HP per battle. In the physical and Nature teams about half of it goes to Wodryn himself, in the magic team more than two thirds: the mages next to him barely crit.\",\"p3\":\"True crit heroes shed the most after Wodryn himself: more than half of the hits on \u003cleonel\u003e\u003c/leonel\u003e are reduced, about half on \u003coya\u003e\u003c/oya\u003e, 44% on \u003cyasmine\u003e\u003c/yasmine\u003e. The link is not strict — \u003cyasmine\u003e\u003c/yasmine\u003e crits the most in battle yet gets fewer hits reduced than \u003cleonel\u003e\u003c/leonel\u003e — but the order is clear: crit heroes get the most out of Wodryn, mages the least.\"},\"crit\":{\"heading\":\"Crit for allies: a single window\",\"p1\":\"The main promise in the hints about Wodryn is \\\"physical heroes crit more often under his buffs\\\". I looked at how often the allies crit: inside the Deepwood Might window, outside it, and over the whole battle — with Wodryn and with \u003cjulius\u003e\u003c/julius\u003e in his place.\",\"table\":{\"hero\":\"Hero\",\"in\":\"In window\",\"out\":\"Outside\",\"withWodryn\":\"Battle with Wodryn\",\"withJulius\":\"With Julius\"},\"caption\":\"My build, crit share of physical hits; 150 battles per team.\",\"p2\":\"The window is single and lasts 9 seconds, and it does not work for everyone. Heroes with modest crit of their own gain a lot: \u003ctristan\u003e\u003c/tristan\u003e goes from 13 to 32% inside the window, \u003ccrow\u003e\u003c/crow\u003e from 10 to 18%. Mages land physical crits only inside the window: \u003ciris\u003e\u003c/iris\u003e crits on almost a third of her hits there and on none outside it. \u003coya\u003e\u003c/oya\u003e, \u003cyasmine\u003e\u003c/yasmine\u003e and \u003cleonel\u003e\u003c/leonel\u003e, who already crit on 30–47% of hits, do not crit more in the window. Over the whole battle the allies do not crit more often with Wodryn than with another tank, and Oya and Yasmine even less. The promise holds only for those nine seconds and only for low-crit heroes.\",\"self\":{\"title\":\"Does Wodryn's own crit grow\",\"p1\":\"Another promise is that \\\"in a long battle Wodryn's own crit grows towards the end\\\". He does have a peak: 50% in seconds 10–15, while Deepwood Might and the first ultimates are active. After that his crit stays at 24–37% and does not grow towards the end: Deepwood Might fires once, so there is nothing to stack.\",\"caption\":\"Wodryn's crit share by battle segment (seconds), my build, 150 battles.\"}},\"cleanse\":{\"heading\":\"The cleanse: once, and on time\",\"p1\":\"Bark Renewal removes debuffs and control from Wodryn and the allies behind him. But like Deepwood Might it practically fires once per battle — the first cast comes at second seven, after that Wodryn only ults. So what matters is not how many debuffs the opponent applies, but what is on the team at that exact moment:\",\"cards\":{\"withIris\":\"Against teams with \u003ciris\u003e\u003c/iris\u003e\",\"withoutIris\":\"Against the rest\",\"perBattle\":\"effects removed per battle\",\"perCast\":\"per cast: {value}\",\"ults\":\"ultimates per battle: {value}\",\"energy\":\"+100 energy: {value} times\"},\"late\":{\"title\":\"Arrive after the cleanse\",\"text\":\"of enemy debuffs: out of {debuffs} per battle on average, no Bark cast ever catches them\"},\"caption\":\"My build, {battles} battles with Wodryn.\",\"why\":\"The first Bark cast comes at {firstBark} s on average, and {lateShare} of all enemy debuffs in a battle arrive later — the cleanse simply cannot reach them. Short control — stuns, knockbacks, sleep — has usually ended on its own by second seven, so there is nothing to remove.\",\"p2\":\"Against \u003ciris\u003e\u003c/iris\u003e it is different: by second seven her damage over time and debuffs sit on all five heroes at once, and a single cast removes more than ten effects. What Wodryn removes most often:\",\"effects\":{\"SupportDebuff\":\"debuff from the Support class skill\",\"IrisDot\":\"\u003ciris\u003e\u003c/iris\u003e's damage over time\",\"Debuff\":\"\u003ciris\u003e\u003c/iris\u003e's debuff\",\"Hero70Sleeping\":\"\u003csomna\u003eSomna\u003c/somna\u003e's sleep\",\"Hero71Skill2Effect\":\"\u003celectraVonGrave\u003e\u003c/electraVonGrave\u003e's debuff\",\"Hero54Skill8Effect\":\"debuff from \u003ciris\u003eIris\u003c/iris\u003e's relic\",\"Stun\":\"stun\"},\"p3\":\"Against \u003ciris\u003e\u003c/iris\u003e the cleanse also speeds Wodryn up: Oak Bark lasts longer, the energy bonus arrives {energyIris} times per battle versus {energyNoIris} otherwise, and he fires almost twice as many ults.\",\"p4\":\"Against \u003cdante\u003e\u003c/dante\u003e and \u003ctempus\u003e\u003c/tempus\u003e the cleanse helps less than you would expect from heroes with lots of debuffs, for different reasons. Against \u003cdante\u003e\u003c/dante\u003e teams, in half the battles ({danteNoCast}) Wodryn does not survive to the cast or never gets to make it — he is knocked back, stunned and finished off — and almost all of Dante's debuffs ({danteLate}) arrive after second seven anyway. \u003ctempus\u003e\u003c/tempus\u003e nearly always stands with \u003ciris\u003e\u003c/iris\u003e, where the cleanse works great — but Bark does not remove his freeze. Against the remaining teams Wodryn removes {perBattleNoIris} effects per battle on average — there the cleanse decides almost nothing.\"},\"tanks\":{\"heading\":\"Wodryn among the tanks\",\"p1\":\"The key question for any new tank is who he replaces. I put different tanks into the same team, changing only the tank, and checked it over many battles: a physical team (\u003cguus\u003e\u003c/guus\u003e, \u003ccrow\u003e\u003c/crow\u003e, \u003coya\u003e\u003c/oya\u003e, \u003ctristan\u003e\u003c/tristan\u003e, tank) and a magic team modeled on the most common magic Arena defense (\u003cpolaris\u003e\u003c/polaris\u003e, \u003ciris\u003e\u003c/iris\u003e, \u003ctempus\u003e\u003c/tempus\u003e, \u003cbyrna\u003e\u003c/byrna\u003e, tank). All twelve tanks share one build; the opponents are at the same build.\",\"p2\":\"In the physical team Wodryn comes first at any build, in the magic team he does not: at the average build he is mid-table, at the max build second after Julius. And even with the physical team he builds his lead against specific opponents. So below is the same comparison broken down by defense type.\",\"estimateTitle\":\"Twelve tanks at an equal build (estimate)\",\"caption\":\"Team win rate against popular Arena defenses, 100 battles per cell. Tanks are sorted by the sum of both teams.\",\"p3\":\"Here is the picture. With the physical team at the average build Wodryn is clearly first against \u003ciris\u003e\u003c/iris\u003e teams — that is where his cleanse works — and against \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e. Against \u003csatori\u003e\u003c/satori\u003e and \u003cfolio\u003e\u003c/folio\u003e defenses and against \u003cjulius\u003e\u003c/julius\u003e with \u003caidan\u003e\u003c/aidan\u003e he sits in the middle or at the bottom: \u003cjulius\u003e\u003c/julius\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e handle those better. With the mages Wodryn is first only against Iris, and only tied with \u003crufus\u003e\u003c/rufus\u003e; against Kendle and Cleaver, Cleaver himself as the tank wins far more often. At the max build Wodryn arrives with a full relic and Law of the Forest and leads the physical team almost everywhere — only against Kendle and Cleaver does Julius hold the team better. And for the magic team at max Julius is the better fit against almost everyone. Wodryn is a strong tank for physical teams in the current meta, not a replacement for any tank in any team.\",\"table\":{\"tank\":\"Tank\",\"power\":\"Power\",\"phys\":\"Physical\",\"magic\":\"Magic\",\"thousand\":\"k\"},\"groupsTitle\":\"Who Wodryn handles better than others\",\"groupsIntro\":\"Each cell shows the win rate with Wodryn and his place among twelve tanks; below it, the best of the other tanks against that defense type.\",\"groups\":{\"opponent\":\"Opponent defense\",\"iris\":\"With \u003ciris\u003e\u003c/iris\u003e\",\"kendleCleaver\":\"With \u003ckendle\u003e\u003c/kendle\u003e or \u003ccleaver\u003e\u003c/cleaver\u003e\",\"satoriFolio\":\"With \u003csatori\u003e\u003c/satori\u003e or \u003cfolio\u003e\u003c/folio\u003e\",\"juliusAidan\":\"With \u003cjulius\u003e\u003c/julius\u003e and \u003caidan\u003e\u003c/aidan\u003e\",\"count\":\"defenses in sample: {n}\",\"place\":\"#{n}\",\"best\":\"best:\",\"next\":\"next:\",\"tie\":\"tied:\"},\"groupsCaption\":\"Estimate: 20–28 battles per tank and team in a cell, so differences within a group are rough — look at the place rather than the percentages. Defenses that fit none of the groups are not shown.\"},\"artifact\":{\"heading\":\"Artifacts\",\"p1\":\"Wodryn's weapon \u003cweapon\u003e\u003c/weapon\u003e gives the team Magic Defense on every Crown of Wrath. The book adds crit and Magic Defense, the ring adds Strength.\",\"p2\":\"After second ten Crown of Wrath comes every three seconds — faster than the weapon buff can expire. So the team keeps Magic Defense almost all the time, much like the armor penetration from \u003ctristan\u003e\u003c/tristan\u003e's ult, which he refreshes before the previous one runs out. And Wodryn's team needs Magic Defense for the golden relic too — more on that below.\"},\"relics\":{\"heading\":\"Relic: what each tier gives\",\"note\":\"Relic card numbers are computed at the full max build. Wodryn has no relic on my account, so everything in this section is an estimate.\",\"tiers\":{\"RELIC_1\":{\"label\":\"Green relic — level 1\",\"text\":\"Wildwood Fury: every 15 seconds, for 9 seconds, crits from Wodryn and allies deal extra physical damage based on their own Magic Defense. It does not show up as a separate hit, but even the first tier noticeably strengthens both Wodryn and the team: at the average build wins go up by about a fifth.\"},\"RELIC_2\":{\"label\":\"Blue relic — level 10\",\"text\":\"While Oak Bark is active, every 6 hits taken make Wodryn strike the enemies in front of him. Wodryn is hit often, so the gain is significant: {barkAvg}–{barkMax} million damage per battle.\"},\"RELIC_3\":{\"label\":\"Purple relic — level 20\",\"text\":\"Every hit reduced by Unbowed Oak gives Wodryn 2 layers of Oak Bark. Bark stays up permanently and energy keeps flowing — the second jump: wins go up by roughly another sixth, and by a fifth against \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e teams.\"},\"RELIC_4\":{\"label\":\"Golden relic — level 30\",\"text\":\"Law of the Forest: while Wodryn is alive, all pure damage the enemies deal to his team becomes magic damage. It sounds modest, but it is the strongest tier against the current meta — see below.\"}},\"tableTitle\":\"Win rate by relic tier\",\"tableIntro\":\"To see what each tier adds on its own, I took the same team — \u003cguus\u003e\u003c/guus\u003e, \u003ccrow\u003e\u003c/crow\u003e, \u003coya\u003e\u003c/oya\u003e, \u003ctristan\u003e\u003c/tristan\u003e, \u003cwodryn\u003e\u003c/wodryn\u003e — and changed only Wodryn's relic. Everything else is identical: allies' build, opponents, rules.\",\"table\":{\"tier\":\"Tier\",\"none\":\"no relic\",\"avgField\":\"Average: field\",\"avgFocus\":\"Average: Kendle, Cleaver\",\"maxField\":\"Maximum: field\",\"maxFocus\":\"Maximum: Kendle, Cleaver\"},\"tableCaption\":\"Estimate. The max build starts at relic 1.\",\"method\":{\"title\":\"Where these numbers come from\",\"p1\":\"Each cell is the share of battles won out of 80. \\\"Field\\\" is the 40 most common Arena defenses without \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e, 2 battles each; \\\"Kendle, Cleaver\\\" is the 10 defenses with them, 8 battles each, so the sample is denser against the teams most dangerous for Wodryn. Opponents always have the same build as my team. The table covers 1,440 battles in total.\",\"p2\":\"So what matters is not each number on its own (spread ±5 pp) but where wins go up noticeably: at tier 1, at tier 20 and — against Kendle and Cleaver — at tier 30.\"}},\"law\":{\"title\":\"Law of the Forest against Kendle and Cleaver\",\"p1\":\"Pure damage ignores both Armor and Magic Defense — that is why \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e are so dangerous for any team. Law of the Forest turns it into magic damage, and Wodryn's team handles magic damage well: his weapon and book give it Magic Defense. Damage taken by the team per battle against teams with Kendle and Cleaver:\",\"table\":{\"variant\":\"Upgrade\",\"tier\":\"Tier\",\"pure\":\"Pure, M\",\"magic\":\"Magic, M\",\"physical\":\"Physical, M\"},\"caption\":\"Estimate. Pure damage comes from \u003ccleaver\u003e\u003c/cleaver\u003e and \u003ckendle\u003e\u003c/kendle\u003e; at tier 30 it almost disappears.\",\"p2\":\"At tier 30 pure damage almost disappears, while magic damage does not grow — Magic Defense absorbs the converted damage. At the max build this gives about a quarter more wins against \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e. If you level Wodryn's relic for a single tier, make it this one.\"},\"comps\":{\"heading\":\"Who to pair Wodryn with\",\"p1\":\"I checked both lineups from the developers' hints and two teams I found myself. Each cell is the win rate with Wodryn; in brackets, the same team with \u003cjulius\u003e\u003c/julius\u003e as the tank — this shows what Wodryn himself adds. Heroes are placed as they stand on the battlefield: the front line is on the right.\",\"table\":{\"team\":\"Lineup\"},\"names\":{\"honorGuus\":\"Honor and Guus\",\"natureAlvanor\":\"Nature\",\"natureByrna\":\"Nature with Byrna\"},\"caption\":\"My build — 150 battles each, average and max — 100 each (estimate). \u003calvanor\u003e\u003c/alvanor\u003e is not leveled on my account (power 39k), so his row in the \\\"My build\\\" column says nothing about the lineup.\",\"p2\":\"\u003cb\u003eNature.\u003c/b\u003e The hinted lineup (\u003calvanor\u003e\u003c/alvanor\u003e, \u003cyasmine\u003e\u003c/yasmine\u003e, \u003cleonel\u003e\u003c/leonel\u003e, \u003coya\u003e\u003c/oya\u003e, \u003cwodryn\u003e\u003c/wodryn\u003e) only looks good at the average build, where Wodryn is clearly stronger than \u003cjulius\u003e\u003c/julius\u003e. At max it is the weakest of the five lineups, and Wodryn even falls behind Julius there.\",\"p3\":\"\u003cb\u003eHonor and Guus.\u003c/b\u003e The anti-magic lineup holds up at any build, and Wodryn consistently adds wins compared with \u003cjulius\u003e\u003c/julius\u003e: \u003cguus\u003e\u003c/guus\u003e raises crit damage, and \u003ctristan\u003e\u003c/tristan\u003e gives the team armor penetration and energy.\",\"p4\":\"\u003cb\u003eMy find.\u003c/b\u003e The best is \u003cnebula\u003e\u003c/nebula\u003e, \u003cyasmine\u003e\u003c/yasmine\u003e, \u003cguus\u003e\u003c/guus\u003e, \u003ctristan\u003e\u003c/tristan\u003e, \u003cwodryn\u003e\u003c/wodryn\u003e: more than half the battles won on my build and almost all of them at max. What the strong lineups share is \u003cguus\u003e\u003c/guus\u003e and \u003ctristan\u003e\u003c/tristan\u003e next to Wodryn. But Tristan comes with a caveat, and it matters.\",\"legend\":{\"wodryn\":\"with Wodryn\",\"julius\":\"(with Julius)\"}},\"summary\":{\"heading\":\"Summary\",\"s1\":\"\u003cb\u003eWodryn is a defender first.\u003c/b\u003e Unbowed Oak cuts by two thirds about half of the hits on him and a noticeable share of hits on the crit heroes next to him, saving the team {savedMin}–{savedMax}M HP per battle.\",\"s2\":\"\u003cb\u003eNon-stop ultimate.\u003c/b\u003e Oak Bark gives energy for every hit on Wodryn, and after the tenth second he casts his ultimate every three seconds. Bark Renewal and Deepwood Might fire once or twice per battle.\",\"s3\":\"\u003cb\u003eCrit for allies is a single 9-second window.\u003c/b\u003e Inside it, heroes with modest crit of their own (\u003ctristan\u003e\u003c/tristan\u003e, \u003ccrow\u003e\u003c/crow\u003e, mages) crit twice as often or more, the highest-crit heroes do not; over the whole battle the allies do not crit more. Wodryn's own crit does not grow towards the end of the battle either.\",\"s4\":\"\u003cb\u003eA strong tank for physical teams, but not for every team.\u003c/b\u003e With the physical team at an equal build he is first among twelve tanks — thanks to \u003ciris\u003e\u003c/iris\u003e teams, where the cleanse works, and \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e teams. In the magic team he is mid-table, and against \u003csatori\u003e\u003c/satori\u003e, \u003cfolio\u003e\u003c/folio\u003e, \u003cjulius\u003e\u003c/julius\u003e with \u003caidan\u003e\u003c/aidan\u003e other tanks do as well or better.\",\"s5\":\"\u003cb\u003eRelic — all the way to 30.\u003c/b\u003e The first and purple tiers noticeably strengthen the team, and the golden Law of the Forest turns Wodryn into an answer to \u003ckendle\u003e\u003c/kendle\u003e and \u003ccleaver\u003e\u003c/cleaver\u003e.\",\"outro\":\"Put Wodryn next to \u003cguus\u003e\u003c/guus\u003e and \u003ctristan\u003e\u003c/tristan\u003e — that is where he shines. The higher Tristan's relic, the stronger that team is with any tank; while it is below tier 20, Wodryn is what makes the difference.\"},\"collabNote\":\"Disclosure: this article was prepared as part of a collaboration with the Hero Wars developers — Wodryn and the Talisman of Two Forms were provided by them for testing. Until October 26, 2026, 4:00, Wodryn cannot be used in the Arena, Grand Arena, Guild War and Global Championship.\",\"disclaimer\":\"Statistics are test battles under Arena rules on auto; manual battles and other modes may differ. Skill cards and stats are live Warden calculator data and update along with the game.\",\"tristan\":{\"title\":\"Tristan and his tier 20 relic\",\"p1\":\"The purple tier of \u003ctristan\u003e\u003c/tristan\u003e's relic — Blessed Vanguard — passes part of the energy Tristan gains from his skill to physical allies: the whole team ults more often. To see how much the lineups rely on it, I checked three Tristan teams at every tier of his relic — and each time again with \u003cjulius\u003e\u003c/julius\u003e instead of Wodryn. Each cell is the win rate with Wodryn; in brackets, with Julius:\",\"table\":{\"tier\":\"Tristan's relic\"},\"caption\":\"My build, only Tristan's relic changes (mine is tier 10); 150 battles per cell. The first number is with Wodryn, in brackets — with Julius instead of him.\",\"p2\":\"Two things stand out. First: Tristan's tier 20 is the biggest jump in the whole table, with up to a third more wins. But every team with Tristan gets that jump, with \u003cjulius\u003e\u003c/julius\u003e even more so. The battles show no faster charging \\\"under Wodryn\\\": Tristan ults about as often with him as with Julius (3–4 times per battle), and the rest of the team even slightly less. So the lineup's best result at max owes a lot to Tristan's relic, not to Wodryn alone.\",\"p3\":\"Second, and this answers \\\"what if my Tristan is not leveled\\\": while Tristan's relic is below tier 20, it is Wodryn who adds the most — he consistently beats \u003cjulius\u003e\u003c/julius\u003e as the tank. From tier 20 on the team is stronger with any tank, and in two lineups out of three the gap almost disappears. All my-build numbers in the lineup table are computed with a tier 10 Tristan.\"}}},\"clash\":{\"layout\":{\"backToMain\":\"Back to home\",\"title\":\"Guild Clash\",\"subtitle\":\"Tournament registration tracking, analysis of opponents' placements and strength, and planning your own placement\",\"tabs\":{\"roster\":\"Roster\",\"tournaments\":\"Tournaments\"}},\"lines\":{\"LINE_1\":\"Line 1\",\"LINE_2\":\"Line 2\",\"LINE_3\":\"Line 3\",\"short_1\":\"1\",\"short_2\":\"2\",\"short_3\":\"3\"},\"tournaments\":{\"loading\":\"Loading tournaments...\",\"startDate\":\"Start date\",\"waitingOpponents\":\"Opponents not drawn yet\",\"open\":\"Open tournament\",\"empty\":{\"title\":\"No tournaments yet\",\"hint\":\"A tournament shows up here on its own once the Warden extension sends data for a new Clash cycle — just open the game and go to the Clash section.\"},\"toast\":{\"loadError\":\"Failed to load tournaments\"}},\"teamFlag\":{\"teamPlace\":\"{name} — place {position}\"},\"tournament\":{\"loading\":\"Loading tournament data...\",\"loadingShort\":\"Loading...\",\"backToList\":\"Back to list\",\"table\":\"Table\",\"tableTitle\":\"Tournament table\",\"titleWithDate\":\"Tournament of {date}\",\"waiting\":{\"title\":\"Waiting for opponents\",\"hint\":\"The game has not drawn the group and schedule yet. The tournament fills in by itself once they appear.\"},\"toast\":{\"loadError\":\"Failed to load tournament\"}},\"battleStep\":{\"loadingDeployments\":\"Loading deployments\",\"loadingMap\":\"Loading the tactical map...\",\"currentStage\":\"Current stage\",\"terminalTitle\":\"Dep int\":\"Click a team for detailed analysis\"}},\"progress\":{\"title\":\"Guild Progress\",\"playersCountTitle\":\"Players with data in the selected period\",\"dates\":{\"asOf\":\"Data as of:\",\"compare\":\"Compare period\",\"staleHint\":\"To refresh — open Global Championship → Defense in the game. The data will load automatically.\",\"comparePrevTitle\":\"Comparison baseline (earlier). Sundays are highlighted in blue — typical reference points in the Global Championship.\",\"compareLatestTitle\":\"Current date. Sundays are highlighted in blue — typical reference points in the Global Championship.\",\"emptyOption\":\"—\"},\"freshness\":{\"today\":\"today\",\"yesterday\":\"yesterday\",\"daysAgo\":\"{n} days ago\"},\"viewModes\":{\"total\":\"Account Power\",\"totalTitle\":\"Compare players by full account power\",\"all\":\"GC Defense Power\",\"heroes\":\"Heroes only\",\"titans\":\"Titans only\"},\"layoutModes\":{\"cards\":\"Cards\",\"cardsTitle\":\"Card view\",\"table\":\"Table\",\"tableTitle\":\"Print view\",\"text\":\"Text\",\"textTitle\":\"For copying to Telegram\"},\"buttons\":{\"backToServices\":\"← Back to services\",\"copyGuildRoster\":\"Copy rosters\",\"copyGuildRosterTitle\":\"Copy every player's roster: “Nick: code power, code power…”, one player per line\"},\"loading\":\"Loading players...\",\"empty\":{\"title\":\"No progress data here yet\",\"body\":\"To get it, open Global Championship → Defense in the game. The extension will catch the data and send it here automatically — usually within a few seconds.\",\"hint\":\"After that just refresh this page — the data will load.\"},\"card\":{\"deleteTitle\":\"Delete\",\"new\":\"New\",\"newBadgeTitle\":\"Player appeared within the selected period\",\"left\":\"Left\",\"leftBadgeTitle\":\"Player disappeared by the end of the selected period\",\"lastSnapshot\":\"Last snapshot: {date}\",\"vs\":\"vs\",\"noRoster\":\"— no roster —\",\"copyRoster\":\"Copy roster as “code power”\",\"rosterCopied\":\"Roster copied\"},\"table\":{\"colPlayer\":\"Player\",\"colTotal\":\"Total Power\",\"colHeroes1\":\"Heroes 1\",\"colHeroes2\":\"Heroes 2\",\"colHeroes3\":\"Heroes 3\",\"colTitans\":\"Titans\",\"new\":\"New\",\"newBadgeTitle\":\"Player appeared within the selected period\",\"left\":\"Left\",\"leftBadgeTitle\":\"Player disappeared by the end of the selected period\",\"rankUpTitle\":\"Moved up {n} positions\",\"rankDownTitle\":\"Moved down {n} positions\",\"rankSameTitle\":\"No change\",\"vs\":\"vs\"},\"text\":{\"previewTitle\":\"Telegram preview\",\"sendTelegram\":\"To guild chat\",\"sending\":\"Sending…\",\"sendTitle\":\"Will send a compact overall-power report to the guild chat\",\"copy\":\"Copy text\",\"copied\":\"Copied!\",\"digest\":{\"title\":\"🏆 Guild Progress\",\"period\":\"📅 Period: {prev} ➔ {latest}\",\"asOf\":\"📅 As of: {latest}\",\"empty\":\"No data for the report.\",\"since\":\"since {date}\"}},\"total\":{\"empty\":\"No account-power data yet. Open guild members' cards in the game — the extension will catch their full power.\",\"needLoad\":\"ℹ️ Need to load (open members' cards in the game): {names}\",\"noData\":\"ℹ️ No data: {names}\",\"howTo\":{\"title\":\"How to collect account power\",\"body\":\"Power comes in one player at a time. In the game, open a guild member's profile — via the Guild Registry or any other list of guild players. Each opened profile sends that player's full account power to Warden. Go through everyone you want to see here, then refresh the page.\"},\"digest\":{\"title\":\"🏆 Account Power\"},\"chart\":{\"title\":\"Account power over time\",\"hint\":\"Click names to show or hide players on the chart. The scale adjusts to the selection.\",\"selected\":\"{count} of {max} selected\",\"selectAll\":\"Select all\",\"clear\":\"Clear\",\"rangePeriod\":\"Period\",\"rangePeriodTitle\":\"Only dates of the selected comparison period\",\"rangeAll\":\"All time\",\"rangeAllTitle\":\"The whole accumulated power history\",\"emptyPeriod\":\"No data for the selected period n language\",\"locale\":{\"ru\":\"Русский\",\"en\":\"English\"},\"assignTeam\":{\"label\":\"Team in assignment messages\",\"withTeam\":\"Include the attack team\",\"withTeamHint\":\"The heroes or titans to attack with, under the player. Applies to the buttons on the GW/GC day page and to messages about in-game marks; when sending from the site you can choose otherwise for that one send.\"},\"gameMarks\":{\"label\":\"In-game target marks (GW)\",\"description\":\"When an officer assigns a player to a target right in the game, Warden copies the mark into the attack plan. A chat message for every mark is optional; otherwise assignments go out as one summary with the “Send all” button on the war day page.\",\"assign\":\"Post assignments\",\"assignHint\":\"A message for every mark — only in chats where the player is linked.\",\"unassign\":\"Post removals\",\"unassignHint\":\"A message when a player is removed from a target in the game. When a player is replaced, the game removes the previous one first.\"},\"fortWars\":{\"label\":\"Fort wars\",\"enabled\":\"Post about fort wars\",\"hint\":\"Our attack declared or an attack on our fort, a reminder one minute before the battle, and the result. Warden learns about a war when a guild member with the extension is in the game.\"},\"warTries\":{\"label\":\"Unplayed GW and GC attempts\",\"off\":\"No reminder\",\"hours\":\"{hours} h before the war day ends\",\"hoursAt\":\"{hours} h before the day ends — at {time}\",\"dayEnd\":\"The war day ends at {time} in your device time zone.\",\"dayEndUnknown\":\"The exact time will appear after the guild’s first war day in Warden.\",\"hint\":\"One message mentioning everyone who still has attempts. Attempts come from the day layout that Warden sends from a guild member: without a fresh layout the reminder waits for one and may not arrive.\"},\"guildEvents\":{\"label\":\"Guild\",\"rosterJoined\":\"Players joining the guild\",\"rosterJoinedHint\":\"Who joined the guild or came back to it.\",\"r
